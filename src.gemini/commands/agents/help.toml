description = "Summarize the Gemini example-pack structure, role surface, and orchestration layers."
prompt = """
Read GEMINI.md, README.md, skills/README.md, and skills/lead/SKILL.md.

Summarize:
- the current Gemini example-pack structure
- the role of GEMINI.md
- the universal role-skill catalog under skills/ (one skill per role, read by Gemini CLI and Antigravity)
- the role of skills/lead/team-templates in the shared role principle
- why Gemini orchestration stays in the main session under the lead skill
- why external routing must check role eligibility before provider or CLI feasibility
- how the three external roles split advisory, worker-side, and review-side substitution
- how `externalPriorityProfile`, `reserveResolver`, `externalPriorityProfiles`, and `externalOpinionCounts` shape `auto` routing under the shipped `balanced` profile and any repo-local production profile
- how multi-opinion external lanes fail closed when the requested opinion count cannot be satisfied
- how `external-brigade` launches a bounded parallel helper set without turning `externalOpinionCounts` into a generic concurrency cap
- how the same external helper and provider may be reused across multiple disjoint brigade items when the runtime supports concurrent non-interactive execution
- which owner roles remain unsupported without a dedicated external owner adapter
- that this repository classifies Gemini as `WEAK MODEL / NOT RECOMMENDED`
- that shipped `externalProvider: auto` routing uses `codex | claude` only and keeps Gemini/Qwen out of production profiles
- that explicit `externalProvider: gemini` or `externalProvider: qwen` remains a manual `WEAK MODEL / NOT RECOMMENDED` example or compatibility path only
- how the shared `externalModelMode` distinguishes runtime-default provider selection from pinned top-model execution on the production provider paths
- how `externalCodexProfile: default | gpt-5.6-sol-xhigh | gpt-5.6-sol-max | gpt-5.6-luna` controls Codex-specific profile choice after provider resolution
- `gpt-5.6-sol-xhigh` pins model gpt-5.6-sol with reasoning_effort "xhigh"; `gpt-5.6-sol-max` pins model gpt-5.6-sol with reasoning_effort "max" for higher-complexity/hard lanes; `gpt-5.6-luna` is the bounded mechanical-overflow path, a distinct fast/volume model with reasoning_effort "medium"
- how `reserve` works as an advisory/review-only symbolic candidate
- the role of Gemini CLI /init, .gemini/settings.json, and .gemini/.agents-mode.yaml
- the local command namespace
"""
