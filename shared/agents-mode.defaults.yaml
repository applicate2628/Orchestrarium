# Operator posture.
consultantMode: disabled  # allowed: external | internal | disabled; default: disabled
delegationMode: manual  # allowed: manual | auto | force; default: manual
parallelMode: auto  # allowed: manual | auto | force; default: auto
mcpMode: auto  # allowed: auto | force; default: auto

# External-adapter preferences.
preferExternalWorker: false  # allowed: false | true; default: false
preferExternalReviewer: false  # allowed: false | true; default: false
externalProvider: auto  # allowed here: auto | codex | claude | gemini | qwen; default: auto; gemini/qwen are explicit example-only and not recommended
externalPriorityProfile: balanced  # allowed: balanced | quality-first | <repo-local production profile>; default: balanced
reserveResolver: claude-sonnet  # allowed: disabled | claude-sonnet | claude-wrapper | wrapper:<command>; default: claude-sonnet

# Provider priority profiles used when externalProvider=auto.
externalPriorityProfiles:  # allowed: profile -> lane -> ordered provider priority used when externalProvider=auto
  balanced:  # default shared routing profile
    # RF12 L00 owner/control is intentionally absent: owner roles have no generic external adapter.
    advisory.repo-understanding: [claude, codex, reserve]  # advisory rank: claude > codex > reserve
    advisory.design-adr: [claude, codex, reserve]  # design/ADR advisory rank
    design.ui-ux-structure: [codex, claude]  # UX structure rank: codex for staged closure, claude for compact trace work
    worker.reasoning-constraints: [claude, codex]  # science/constraints rank: claude compact edge, codex staged fallback
    worker.default-implementation: [codex, claude]  # implementation rank: codex staged/API-accountability, claude compact fallback
    worker.systems-performance-implementation: [claude, codex]  # systems/perf rank: claude compact hot path, codex staged recovery
    worker.ui-implementation: [claude, codex]  # UI implementation rank: claude compact state/render, codex staged UI accountability
    worker.visual-graphics-visualization: [claude, codex]  # visual worker rank: claude raster/localization, codex staged visual delivery
    review.pre-pr: [claude, codex, reserve]  # pre-PR review rank: claude compact review, codex staged source-bound gates
    review.security: [claude, codex, reserve]  # security review rank: claude compact budget, codex ordinary/staged fallback
    review.performance-architecture: [codex, claude, reserve]  # performance/architecture review rank: codex staged source-bound review
    review.ui-visual-correctness: [codex, claude, reserve]  # visual review rank: codex screenshot-diff first, reserve last
  quality-first:  # quality-first production profile
    # RF12 L00 owner/control is intentionally absent: owner roles have no generic external adapter.
    advisory.repo-understanding: [codex, claude, reserve]  # advisory rank: codex staged/source-bound first, claude compact fallback
    advisory.design-adr: [codex, claude, reserve]  # design/ADR rank: codex staged closure first, claude compact fallback
    design.ui-ux-structure: [codex, claude]  # UX structure rank: codex for staged closure, claude compact fallback
    worker.reasoning-constraints: [claude, codex]  # science/constraints rank: claude compact edge, codex staged fallback
    worker.default-implementation: [codex, claude]  # implementation rank: codex staged/API-accountability, claude compact fallback
    worker.systems-performance-implementation: [codex, claude]  # systems/perf rank: codex staged recovery, claude compact fallback
    worker.ui-implementation: [claude, codex]  # UI implementation rank: claude compact state/render, codex staged fallback
    worker.visual-graphics-visualization: [claude, codex]  # visual worker rank: claude raster/localization, codex staged fallback
    review.pre-pr: [codex, claude, reserve]  # pre-PR review rank: codex staged source-bound gates, claude compact fallback
    review.security: [codex, claude, reserve]  # security review rank: codex traceability first, claude compact fallback
    review.performance-architecture: [codex, claude, reserve]  # performance/architecture review rank: codex staged source-bound review
    review.ui-visual-correctness: [codex, claude, reserve]  # visual review rank: codex screenshot-diff first, reserve last

# Lane-local distinct external opinion counts.
externalOpinionCounts:  # allowed: lane -> minimum distinct external opinions required before closure
  advisory.repo-understanding: 1  # repo-understanding advisory opinions
  advisory.design-adr: 1  # design/ADR advisory opinions
  design.ui-ux-structure: 1  # UX structure design opinions
  worker.reasoning-constraints: 1  # reasoning/constraints worker opinions
  worker.default-implementation: 1  # worker implementation opinions
  worker.systems-performance-implementation: 1  # systems/perf worker opinions
  worker.ui-implementation: 1  # UI implementation worker opinions
  worker.visual-graphics-visualization: 1  # graphics/visualization worker opinions
  review.pre-pr: 1  # pre-PR review opinions
  review.security: 1  # security review opinions
  review.performance-architecture: 1  # performance/architecture review opinions
  review.ui-visual-correctness: 1  # UI visual-correctness review opinions

# External execution environment and model policy.
externalCodexWorkdirMode: neutral  # allowed: neutral | project; default: neutral
externalClaudeWorkdirMode: neutral  # allowed: neutral | project; default: neutral
externalModelMode: runtime-default  # allowed: runtime-default | pinned-top-pro; default: runtime-default
externalCodexProfile: gpt-5.5-xhigh  # allowed: default | gpt-5.5-fast | gpt-5.5-xhigh | gpt-5.3-codex-spark; default: gpt-5.5-xhigh; matches Claude opus-xhigh as the shipped best-effort default; `default` inherits externalModelMode; `gpt-5.5-fast` selects the fast Codex model tier while keeping reasoning_effort = xhigh (it is NOT an effort downgrade); `gpt-5.3-codex-spark` is a SUPPLEMENTAL fast-and-cheap Codex variant (separate rate limits from the gpt-5.5 tier) intended for very routine non-thinking mechanical tasks where the routing layer wants to save the gpt-5.5 token budget — output requires MANDATORY verification by a heavier tier before any commit/push (spark is not a replacement for gpt-5.5, it is the Codex-side equivalent of Sonnet relative to Opus)
