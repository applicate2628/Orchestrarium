name: Orche PR2 release-note migration

on:
  push:
    branches:
      - orche/impl-000-baseline

permissions:
  contents: write

concurrency:
  group: orche-pr2-release-note-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: orche/impl-000-baseline
          fetch-depth: 0

      - name: Add dated release note and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_notes = Path('RELEASE_NOTES.md')
          workflow = Path('.github/workflows/_orche_pr2_release_note.yml')
          text = release_notes.read_text(encoding='utf-8')
          heading = '## 2026-08-26\n'
          marker = '\n## 2026-08-09\n'

          if heading not in text:
              if text.count(marker) != 1:
                  raise SystemExit('expected exactly one 2026-08-09 insertion marker')
              entry = '''\n## 2026-08-26\n\n### Added\n\n- **Stage 0 now provides a reproducible immutable parity baseline before Orche 2.0 runtime migration begins.** The new developer workflow pins the accepted `main` commit and tree, deterministically inventories every tracked baseline file and test, records repository-shape target effects without inventing unavailable runtime measurements, and compares candidate Pytest and command outcomes with the pinned baseline. **Why it matters:** maintainers can prove that files, tests, known failures, exit semantics, and baseline identity were not silently lost before later migration or legacy removal. **Developer workflow:** run the commands documented in `baseline/orchestrarium-v1/README.md`; generated review evidence remains local under `.scratch/orche-stage0/`. **Preserved:** installed provider runtimes, roles, workflows, hooks, installers, user configuration, publication behavior, and current Orchestrarium runtime semantics are unchanged.\n'''
              text = text.replace(marker, entry + marker, 1)
              release_notes.write_text(text, encoding='utf-8')

          workflow.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_NOTES.md .github/workflows/_orche_pr2_release_note.yml
          git diff --cached --check
          git commit -m 'docs: record Stage 0 baseline workflow'
          git push origin HEAD:orche/impl-000-baseline
