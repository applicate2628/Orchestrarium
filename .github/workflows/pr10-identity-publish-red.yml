name: PR 10 identity publication patch

on:
  push:
    branches:
      - hotfix/lifecycle-successor-transfer
    paths:
      - .github/workflows/pr10-identity-publish-red.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/lifecycle-successor-transfer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-head patch
        run: python scripts/pr10_identity_publish_patch.py
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema pyyaml
      - name: Verify publication owners
        shell: bash
        run: |
          python -m py_compile scripts/agent-run-ledger.py
          git diff --check
          python -m pytest -q \
            tests/test_pr10_identity_bound_publish.py \
            tests/test_pr10_followup_regressions.py \
            tests/test_pr10_integrity_regressions.py \
            tests/test_noncanonical_replay_staging_ownership.py \
            tests/test_noncanonical_ledger_recovery.py \
            tests/test_agent_run_ledger.py
      - name: Publish verified checkpoint
        shell: bash
        run: |
          rm .github/workflows/pr10-identity-publish-red.yml
          rm scripts/pr10_identity_publish_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): bind ledger publication to admitted inode"
          git push origin HEAD:hotfix/lifecycle-successor-transfer
