name: PR 4 deep-audit candidate r1

on:
  push:
    branches:
      - automation/pr4-self-audit-20260904-3dbfb9fa

permissions:
  contents: write

concurrency:
  group: pr4-deep-audit-candidate-r1
  cancel-in-progress: false

env:
  SOURCE_HEAD: 3dbfb9faf824365f5898fe52dd10093f4d75da9c
  BASE_HEAD: ece04040627fcc0d0988128e44d401de53ff01fb
  CANDIDATE_BRANCH: automation/pr4-deep-audit-fixes-20260904-r1
  SHARD_TOTAL: '6'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed exact-source fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          import runpy
          from pathlib import Path

          ROOT = Path.cwd()


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8", newline="\n")


          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact preimage, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))


          # 1. Static analysis found one real unresolved annotation import.
          replace_once(
              "scripts/production_installer.py",
              "from typing import Any\n",
              "from typing import Any, Callable\n",
          )

          # 2. Resolve the Codex executable only inside the real hosted probe.
          # Injected inventory providers must remain a complete test/adapter seam.
          replace_once(
              "scripts/check-hook-health.py",
              """def _codex_hooks_list(
              *,
              codex_command: list[str],
              codex_home: Path,
              query_cwd: Path,
              timeout: float = 15,
          ) -> list[dict[str, Any]]:
              \"\"\"Ask the Codex host for its current hook admission inventory, read-only.\"\"\"
              if not codex_command or not Path(codex_command[0]).is_absolute():
          """,
              """def _codex_hooks_list(
              *,
              codex_command: list[str] | None,
              codex_home: Path,
              query_cwd: Path,
              timeout: float = 15,
          ) -> list[dict[str, Any]]:
              \"\"\"Ask the Codex host for its current hook admission inventory, read-only.\"\"\"
              if codex_command is None:
                  codex_command = resolve_codex_command(os.environ.get(\"CODEX_BIN\"))
              if not codex_command or not Path(codex_command[0]).is_absolute():
          """,
          )
          replace_once(
              "scripts/check-hook-health.py",
              """    codex_command: list[str],
              codex_home: Path,
              query_cwd: Path,
          ) -> list[str]:
          """,
              """    codex_command: list[str] | None,
              codex_home: Path,
              query_cwd: Path,
          ) -> list[str]:
          """,
          )
          replace_once(
              "scripts/check-hook-health.py",
              """                codex_command=codex_command
                              or resolve_codex_command(os.environ.get(\"CODEX_BIN\")),
          """,
              """                codex_command=codex_command,
          """,
          )

          hook_test = "tests/test_hook_health.py"
          text = read(hook_test)
          function_start = text.index(
              "def test_hook_health_report_allows_only_touched_pending("
          )
          function_end = text.index("\n\ndef _host_trust_fixture", function_start)
          block = text[function_start:function_end]
          old = (
              '    monkeypatch.setattr(CHECKER, "_codex_hooks_list", lambda **_kwargs: records)\n'
              "    messages = CHECKER.verify_config(\n"
          )
          new = (
              '    monkeypatch.setattr(CHECKER, "_codex_hooks_list", lambda **_kwargs: records)\n'
              "\n"
              "    def unexpected_codex_resolution(_value: str | None = None) -> list[str]:\n"
              "        raise AssertionError(\"injected inventory must not resolve a host executable\")\n"
              "\n"
              '    monkeypatch.setattr(CHECKER, "resolve_codex_command", unexpected_codex_resolution)\n'
              "    messages = CHECKER.verify_config(\n"
          )
          if block.count(old) != 1:
              raise SystemExit("test_hook_health.py: injected-inventory regression anchor mismatch")
          block = block.replace(old, new, 1)
          write(hook_test, text[:function_start] + block + text[function_end:])

          # 3. Re-pin the independent SessionStart test oracle to the intentional
          # runtime-discovery policy now shipped by all three projections.
          policy = runpy.run_path(
              "scripts/universal-hooks/scripts/mcp_continuity_policy.py"
          )
          session_context = policy["SESSION_START_CONTEXT"]
          turn_context = policy["TURN_ANCHOR_CONTEXT"]
          stateful = next(
              line
              for line in session_context.splitlines()
              if line.startswith("For any stateful or indexed repository-understanding tool")
          )
          turn_marker = "Repository-understanding freshness:"
          turn_freshness = turn_context[turn_context.index(turn_marker):]

          reminder_test = "tests/test_sessionstart_reminder_python_hooks.py"
          text = read(reminder_test)
          start = text.index("STATEFUL_REPOSITORY_TOOL_CONTEXT = (")
          end = text.index("# (script, config subdir under cwd", start)
          replacement = (
              f"STATEFUL_REPOSITORY_TOOL_CONTEXT = {stateful!r}\n\n"
              f"TURN_ANCHOR_FRESHNESS_CONTEXT = {turn_freshness!r}\n\n"
          )
          text = text[:start] + replacement + text[end:]
          start = text.index('MCP_CONTEXT = "\\n".join((')
          end = text.index("DELEGATION_HEADING =", start)
          rendered_lines = "".join(
              f"    {line!r},\n" for line in session_context.splitlines()
          )
          replacement = f'MCP_CONTEXT = "\\n".join((\n{rendered_lines}))\n\n'
          text = text[:start] + replacement + text[end:]
          write(reminder_test, text)

          # 4. Correct two semantic errors in the Russian mirror before deriving
          # its reviewed byte pin. Both implementations use structured stdout
          # advisory delivery and exit zero; stderr/exit-one was obsolete prose.
          ru_path = "references-claude/ru/claude-md-structural-enforcement.md"
          replace_once(
              ru_path,
              "Он пишет UTF-8 stderr-предупреждение, ВСЕГДА разрешает вызов инструмента и fail-open; при попадании он теперь выходит с кодом 1 (никогда 2, что заблокировало бы), а чистая проверка выходит с кодом 0 — тот же контракт видимости, что и у его четырёх соседних аудитов, поэтому его предупреждение всплывает как неблокирующее уведомление в транскрипте, а не остаётся невидимым в debug log.",
              "Он доставляет предупреждение МОДЕЛИ через `hookSpecificOutput.additionalContext` в stdout, ВСЕГДА разрешает вызов инструмента и работает fail-open; и при попадании, и при чистой проверке выходит с кодом 0 (никогда 2, который заблокировал бы вызов) — тот же контракт доставки, что и у его четырёх соседних аудитов, поэтому предупреждение поступает непосредственно модели, а не остаётся только уведомлением транскрипта или debug log.",
          )
          replace_once(
              ru_path,
              "При попадании он пишет одну строку stderr `[typed-routing AUDIT]`, указывающую на типизированный реестр (`.claude/agents/*.md` — напр. toolchain-engineer / platform-engineer для `.ps1`/install-работы, engineer-роль для кода, reviewer-роль для review) и выходит с кодом 1 (никогда 2), поэтому подсказка видима, а не только в debug log; чистая проверка выходит с кодом 0.",
              "При попадании он доставляет одно сообщение `[typed-routing AUDIT]` МОДЕЛИ через `hookSpecificOutput.additionalContext` в stdout, указывающее на типизированный реестр (`.claude/agents/*.md` — напр. toolchain-engineer / platform-engineer для `.ps1`/install-работы, engineer-роль для кода, reviewer-роль для review), и выходит с кодом 0 (никогда 2), поэтому подсказка видима модели и не блокирует вызов; чистая проверка также выходит с кодом 0.",
          )

          validator_namespace = runpy.run_path("scripts/validate-claude-md.py")
          raw = (ROOT / ru_path).read_bytes()
          _ids, payloads = validator_namespace["_payload_inventory"](raw)
          if payloads is None:
              raise SystemExit("Russian mirror payload inventory became invalid")
          payload = payloads["hook-behavior-contracts"]
          payload_size = len(payload)
          payload_sha = hashlib.sha256(payload).hexdigest()
          validator_path = "scripts/validate-claude-md.py"
          text = read(validator_path)
          pattern = re.compile(
              r"RU_HOOK_BEHAVIOR_PAYLOAD_PIN = \(\n"
              r"\s+[0-9_]+,\n"
              r'\s+"[0-9a-f]{64}",\n'
              r"\)"
          )
          replacement = (
              "RU_HOOK_BEHAVIOR_PAYLOAD_PIN = (\n"
              f"    {payload_size:_},\n"
              f'    "{payload_sha}",\n'
              ")"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("validate-claude-md.py: Russian payload pin anchor mismatch")
          write(validator_path, text)
          print(f"reviewed Russian hook payload pin: {payload_size} {payload_sha}")

          # 5. Raw-byte hashes are repository contracts. Pin their normal text
          # families to LF on every checkout; retain historical byte fixtures as
          # -text through the existing later, more-specific rule.
          attributes_path = ".gitattributes"
          text = read(attributes_path)
          anchor = "# Historical accepted-prior payloads preserve their source blob bytes, including CRLF.\n"
          lf_block = (
              "# Source, test, manifest, and human contract files participate in exact\n"
              "# SHA-256 byte pins. Keep their checkout bytes host-independent.\n"
              "*.py text eol=lf\n"
              "*.json text eol=lf\n"
              "*.jsonl text eol=lf\n"
              "*.md text eol=lf\n"
              "*.toml text eol=lf\n"
              "*.yaml text eol=lf\n"
              "*.yml text eol=lf\n"
              "*.sh text eol=lf\n"
              "*.ps1 text eol=lf\n\n"
          )
          if text.count(anchor) != 1 or "*.py text eol=lf" in text:
              raise SystemExit(".gitattributes LF-policy anchor mismatch")
          write(attributes_path, text.replace(anchor, lf_block + anchor, 1))

          eol_test = ROOT / "tests/test_text_eol_contract.py"
          if eol_test.exists():
              raise SystemExit("tests/test_text_eol_contract.py already exists")
          eol_test.write_text(
              '''"""Repository byte pins must survive checkout on every supported host."""

          from __future__ import annotations

          import subprocess
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          ATTRIBUTES = ROOT / ".gitattributes"
          REQUIRED_RULES = (
              "*.py text eol=lf",
              "*.json text eol=lf",
              "*.jsonl text eol=lf",
              "*.md text eol=lf",
              "*.toml text eol=lf",
              "*.yaml text eol=lf",
              "*.yml text eol=lf",
              "*.sh text eol=lf",
              "*.ps1 text eol=lf",
          )
          REPRESENTATIVES = (
              "scripts/production_installer.py",
              "shared/agents-mode.presets.json",
              "references-claude/ru/claude-md-structural-enforcement.md",
              "src.codex/skills/github-pr-review-bot/SKILL.md",
          )
          HISTORICAL_FIXTURE = (
              "tests/fixtures/canonical-skill-priors/codex/example/SKILL.md"
          )


          def _attributes(path: str) -> dict[str, str]:
              result = subprocess.run(
                  ["git", "check-attr", "text", "eol", "--", path],
                  cwd=ROOT,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  check=True,
              )
              parsed: dict[str, str] = {}
              for row in result.stdout.splitlines():
                  _path, attribute, value = row.rsplit(": ", 2)
                  parsed[attribute] = value
              return parsed


          def test_byte_pinned_text_families_are_explicitly_lf() -> None:
              lines = ATTRIBUTES.read_text(encoding="utf-8").splitlines()
              for rule in REQUIRED_RULES:
                  assert lines.count(rule) == 1
              fixture_rule = "tests/fixtures/canonical-skill-priors/*/*/** -text"
              assert lines.count(fixture_rule) == 1
              assert lines.index(fixture_rule) > max(lines.index(rule) for rule in REQUIRED_RULES)

              for relative in REPRESENTATIVES:
                  assert _attributes(relative) == {"text": "set", "eol": "lf"}
                  assert b"\\r\\n" not in (ROOT / relative).read_bytes()

              assert _attributes(HISTORICAL_FIXTURE)["text"] == "unset"
          ''',
              encoding="utf-8",
              newline="\n",
          )

          # 6. Repair the old cross-host installer test harness. A regular copied
          # CPython binary named .exe supplies the Windows target contract while
          # the tests still execute the real CLI end to end on POSIX.
          install_test = "tests/test_install_hypothesis_hook.py"
          text = read(install_test)
          helper_anchor = "\n\ndef run_installer(\n"
          helper = r'''

          def _test_python_executable(host_os: str) -> Path:
              if host_os != "windows" or os.name == "nt":
                  return Path(sys.executable)
              executable = Path(tempfile.gettempdir()) / (
                  f"orchestrarium-test-python-{os.getpid()}.exe"
              )
              if not executable.exists():
                  shutil.copy2(Path(sys.executable).resolve(), executable)
                  executable.chmod(executable.stat().st_mode | 0o111)
              return executable


          def _assert_registered_python(
              case: unittest.TestCase, value: str, host_os: str = "posix"
          ) -> None:
              case.assertEqual(Path(value), _test_python_executable(host_os))
          '''
          if text.count(helper_anchor) != 1 or "def _test_python_executable" in text:
              raise SystemExit("test_install_hypothesis_hook.py: helper anchor mismatch")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          text = text.replace(
              "    cmd = [\n        sys.executable,\n",
              "    cmd = [\n        str(_test_python_executable(host_os)),\n",
              1,
          )
          assertion_pattern = re.compile(
              r'self\.assertEqual\(Path\((?P<value>(?:hook|our_hook)\["command"\])\), '
              r'Path\(sys\.executable\)\.resolve\(\)\)'
          )
          text, assertion_count = assertion_pattern.subn(
              lambda match: f'_assert_registered_python(self, {match.group("value")})',
              text,
          )
          if assertion_count < 6:
              raise SystemExit(
                  f"test_install_hypothesis_hook.py: expected >=6 executable assertions, found {assertion_count}"
              )
          windows_function = text.index(
              "    def test_install_claude_windows_python_exec_form(self) -> None:"
          )
          windows_function_end = text.index("\n    def ", windows_function + 8)
          block = text[windows_function:windows_function_end]
          block, count = re.subn(
              r'_assert_registered_python\(self, hook\["command"\]\)',
              '_assert_registered_python(self, hook["command"], "windows")',
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit("Windows Claude executable assertion anchor mismatch")
          text = text[:windows_function] + block + text[windows_function_end:]
          text = re.sub(
              r"python_executable=sys\.executable,",
              'python_executable=str(_test_python_executable(host_os)),',
              text,
              count=2,
          )
          direct_windows_patterns = (
              (
                  '            "claude",\n            python_executable=sys.executable,',
                  '            "claude",\n            python_executable=str(_test_python_executable("windows")),',
              ),
              (
                  '            "codex",\n            python_executable=sys.executable,',
                  '            "codex",\n            python_executable=str(_test_python_executable("windows")),',
              ),
              (
                  '                "codex",\n                python_executable=sys.executable,',
                  '                "codex",\n                python_executable=str(_test_python_executable("windows")),',
              ),
          )
          for old, new in direct_windows_patterns:
              if text.count(old) != 1:
                  raise SystemExit(f"direct Windows executable anchor mismatch: {old!r}")
              text = text.replace(old, new, 1)
          old_expected = 'f"{PureWindowsPath(sys.executable).as_posix()} "'
          new_expected = 'f"{PureWindowsPath(_test_python_executable(\"windows\")).as_posix()} "'
          if text.count(old_expected) != 1:
              raise SystemExit("Windows command expected-path anchor mismatch")
          text = text.replace(old_expected, new_expected, 1)
          if "python_executable=sys.executable" in text:
              raise SystemExit("unconverted cross-host python_executable test input remains")
          write(install_test, text)

          # 7. Record the operator-visible consequences.
          notes_path = "RELEASE_NOTES.md"
          text = read(notes_path)
          heading = "## 2026-09-04\n\n"
          bullets = (
              "- **Byte-pinned source, test, manifest, and human-contract files now checkout with Line Feed (LF) endings on every host.** Python, JSON, JSON Lines, Markdown, TOML, YAML, shell, and PowerShell families are explicitly `eol=lf`, while accepted-prior fixture payloads retain their exact historical bytes through the later `-text` exception. **Why it matters:** Windows checkout conversion can no longer invalidate SHA-256 pins or make an unchanged installer/projection appear corrupt.\n"
              "- **Deep-audit test and mirror contracts now match the shipped runtime behavior.** Hook-health resolves the Codex executable only inside the real host probe, the SessionStart oracle reflects generic runtime discovery, the Russian Claude reference correctly documents structured stdout advisory delivery with exit zero, and cross-host installer tests use a real `.exe`-shaped executable rather than a POSIX shim path. **Why it matters:** injected inventory tests, translated operator guidance, and Linux/Windows verification no longer fail or mislead for reasons unrelated to production behavior.\n"
          )
          if text.count(heading) != 1 or bullets.splitlines()[0] in text:
              raise SystemExit("RELEASE_NOTES.md audit bullet anchor mismatch")
          write(notes_path, text.replace(heading, heading + bullets + "\n", 1))
          PY

          git diff --check
          git status --short

      - name: Run focused red-to-green verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest PyYAML jsonschema ruff
          python -m py_compile \
            scripts/check-hook-health.py \
            scripts/production_installer.py \
            tests/test_hook_health.py \
            tests/test_sessionstart_reminder_python_hooks.py \
            tests/test_install_hypothesis_hook.py \
            tests/test_text_eol_contract.py
          ruff check --select E9,F63,F7,F82 \
            scripts/check-hook-health.py \
            scripts/production_installer.py \
            tests/test_hook_health.py \
            tests/test_sessionstart_reminder_python_hooks.py \
            tests/test_install_hypothesis_hook.py \
            tests/test_text_eol_contract.py
          python -m pytest -q \
            tests/test_hook_health.py::test_hook_health_report_allows_only_touched_pending \
            tests/test_sessionstart_reminder_python_hooks.py \
            tests/test_claude_reference_mirror.py \
            tests/test_install_hypothesis_hook.py \
            tests/test_text_eol_contract.py
          python src.codex/skills/lead/scripts/validate-skill-pack.py
          python src.claude/agents/scripts/validate-skill-pack.py
          git diff --check

      - name: Commit candidate without touching the PR branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${CANDIDATE_BRANCH}"
          git add --all
          git diff --cached --check
          git commit -m "fix: close cross-platform deep-audit gaps"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          echo "sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "Candidate ${candidate_sha}" >> "$GITHUB_STEP_SUMMARY"

  static-and-contracts:
    needs: patch
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest PyYAML jsonschema ruff bandit
      - name: Compile, lint, collect, validate, and security-scan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.patch.outputs.sha }}"
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m py_compile "${files[@]}"
          ruff check --select E9,F63,F7,F82 scripts src.codex src.claude tests install.py
          python -m pytest --collect-only -q
          python src.codex/skills/lead/scripts/validate-skill-pack.py
          python src.claude/agents/scripts/validate-skill-pack.py
          git diff --check "${BASE_HEAD}..${{ needs.patch.outputs.sha }}"
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "${BASE_HEAD}..${{ needs.patch.outputs.sha }}" -- '*.py' | grep -v '^tests/' || true)
          if ((${#changed[@]})); then bandit -q -lll "${changed[@]}"; fi

  tests:
    needs: patch
    name: ${{ matrix.os }} shard ${{ matrix.shard }}/6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest PyYAML jsonschema
      - name: Run deterministic Linux shard
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.patch.outputs.sha }}"
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print | LC_ALL=C sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % SHARD_TOTAL == SHARD_INDEX )); then selected+=("${files[$index]}"); fi
          done
          test "${#selected[@]}" -gt 0
          printf '%s\n' "${selected[@]}"
          python -m pytest -q "${selected[@]}"
      - name: Run deterministic Windows shard
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.patch.outputs.sha }}') { throw 'candidate HEAD mismatch' }
          $files = @(Get-ChildItem tests -File -Filter 'test_*.py' | Sort-Object Name)
          $selected = @()
          for ($index = 0; $index -lt $files.Count; $index++) {
            if (($index % [int]$env:SHARD_TOTAL) -eq [int]$env:SHARD_INDEX) { $selected += $files[$index].FullName }
          }
          if ($selected.Count -eq 0) { throw 'empty test shard' }
          $selected | ForEach-Object { Write-Host $_ }
          python -m pytest -q @selected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
