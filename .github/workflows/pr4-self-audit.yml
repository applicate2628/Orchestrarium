name: PR 4 audit diagnostics

on:
  push:
    branches:
      - automation/pr4-self-audit-20260904-3dbfb9fa

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3dbfb9faf824365f5898fe52dd10093f4d75da9c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive exact Russian reference payload pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path
          validator_path = Path('scripts/validate-claude-md.py')
          spec = importlib.util.spec_from_file_location('validator', validator_path)
          assert spec is not None and spec.loader is not None
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)
          raw = Path('references-claude/ru/claude-md-structural-enforcement.md').read_bytes()
          ids, payloads = validator._payload_inventory(raw)
          assert payloads is not None
          payload = payloads['hook-behavior-contracts']
          print(f'RU_HOOK_PAYLOAD_SIZE={len(payload)}')
          print(f'RU_HOOK_PAYLOAD_SHA256={hashlib.sha256(payload).hexdigest()}')
          print(f'PAYLOAD_IDS={ids!r}')
          PY
      - name: Show current checkout attributes for byte-pinned families
        shell: bash
        run: |
          set -euo pipefail
          git check-attr text eol -- \
            scripts/production_installer.py \
            shared/agents-mode.presets.json \
            references-claude/ru/claude-md-structural-enforcement.md \
            src.codex/skills/github-pr-review-bot/SKILL.md \
            tests/fixtures/canonical-skill-priors/codex/example/SKILL.md || true
