name: PR 4 independent self-audit

on:
  push:
    branches:
      - automation/pr4-self-audit-20260904-3dbfb9fa

permissions:
  contents: read

concurrency:
  group: pr4-self-audit-3dbfb9fa
  cancel-in-progress: false

env:
  AUDIT_HEAD: 3dbfb9faf824365f5898fe52dd10093f4d75da9c
  AUDIT_BASE: ece04040627fcc0d0988128e44d401de53ff01fb
  SHARD_TOTAL: '6'

jobs:
  static-and-contracts:
    name: Static, collection, and pack contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact audited head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML ruff bandit

      - name: Verify exact binding and diff hygiene
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AUDIT_HEAD}"
          git cat-file -e "${AUDIT_BASE}^{commit}"
          git diff --check "${AUDIT_BASE}..${AUDIT_HEAD}"
          test -z "$(git status --porcelain)"

      - name: Compile every tracked Python source
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.py')
          test "${#files[@]}" -gt 0
          python -m py_compile "${files[@]}"

      - name: Strict undefined-name and syntax lint
        working-directory: target
        shell: bash
        run: ruff check --select E9,F63,F7,F82 scripts src.codex src.claude tests install.py

      - name: High-severity security lint on changed production Python
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${AUDIT_BASE}..${AUDIT_HEAD}" -- '*.py' | grep -v '^tests/' || true)
          if ((${#files[@]})); then
            printf 'Scanning changed production files:\n%s\n' "${files[*]}"
            bandit -q -lll "${files[@]}"
          fi

      - name: Collect the complete test suite
        working-directory: target
        run: python -m pytest --collect-only -q

      - name: Run Codex pack validator
        working-directory: target
        run: python src.codex/skills/lead/scripts/validate-skill-pack.py

      - name: Run Claude pack validator
        working-directory: target
        run: python src.claude/agents/scripts/validate-skill-pack.py

  linux-tests:
    name: Linux tests ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out exact audited head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run deterministic shard
        working-directory: target
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AUDIT_HEAD}"
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print | LC_ALL=C sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${files[$index]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          printf 'Shard %s/%s: %s files\n' "${SHARD_INDEX}" "${SHARD_TOTAL}" "${#selected[@]}"
          printf '%s\n' "${selected[@]}"
          python -m pytest -q "${selected[@]}"

  windows-tests:
    name: Windows tests ${{ matrix.shard }}/6
    runs-on: windows-2025
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out exact audited head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run deterministic shard
        working-directory: target
        shell: pwsh
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:AUDIT_HEAD) { throw 'audited HEAD mismatch' }
          $files = @(Get-ChildItem tests -File -Filter 'test_*.py' | Sort-Object Name)
          $selected = @()
          for ($index = 0; $index -lt $files.Count; $index++) {
            if (($index % [int]$env:SHARD_TOTAL) -eq [int]$env:SHARD_INDEX) {
              $selected += $files[$index].FullName
            }
          }
          if ($selected.Count -eq 0) { throw 'empty test shard' }
          Write-Host "Shard $env:SHARD_INDEX/$env:SHARD_TOTAL: $($selected.Count) files"
          $selected | ForEach-Object { Write-Host $_ }
          python -m pytest -q @selected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
