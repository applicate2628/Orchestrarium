name: Temporary PR2 source export r2

on:
  push:
    branches:
      - orche/internal-pr2-source-export-20260830-r2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete Git bundle
        run: git bundle create /tmp/orchestrarium-pr2-r2.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrarium-pr2-source-r2
          path: /tmp/orchestrarium-pr2-r2.bundle
          if-no-files-found: error
          retention-days: 1
