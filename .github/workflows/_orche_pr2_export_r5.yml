name: Internal PR2 Pytest diagnostic r5

on:
  push:
    branches:
      - orche/internal-pr2-export-20260830-r5

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orche/internal-pr2-export-20260830-r5
          path: helper
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: orche/impl-000-baseline
          path: repo
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML
      - name: Apply exact patch and diagnose authenticated worker
        shell: bash
        run: |
          set -euo pipefail
          cat helper/.orche-payload/r5/chunk-* | base64 -d > /tmp/orche-r5.patch.gz
          echo '141e3d72dbbd554d908e53d1dbc8e2caf69df8e3de2128301c9874828c86969d  /tmp/orche-r5.patch.gz' | sha256sum -c -
          gzip -dc /tmp/orche-r5.patch.gz > /tmp/orche-r5.patch
          cd repo
          test "$(git rev-parse HEAD)" = e348ed7760fbb34536d2421148b545f69b67d54a
          git apply /tmp/orche-r5.patch
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import os
          import shutil
          import sys

          root = Path.cwd()
          script = root / 'scripts/baseline/verify_stage0.py'
          spec = importlib.util.spec_from_file_location('verify_stage0_diag', script)
          assert spec and spec.loader
          verifier = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = verifier
          spec.loader.exec_module(verifier)

          diag = Path('/tmp/orche-pytest-diag')
          shutil.rmtree(diag, ignore_errors=True)
          repo = diag / 'repo'
          tests = repo / 'tests'
          tests.mkdir(parents=True)
          (tests / 'test_failure.py').write_text(
              "def test_failure():\n    assert False, 'diagnostic failure'\n",
              encoding='utf-8',
          )
          trusted = diag / 'trusted'
          trusted.mkdir()
          tools = verifier.ExternalTools(
              Path(sys.executable).resolve(),
              Path(shutil.which('git') or 'git').resolve(),
              Path(shutil.which('bash') or 'bash').resolve(),
          )
          env = verifier.build_repository_env(
              tools=tools,
              lane_root=diag / 'lane',
              repo_root=repo,
          )
          log = trusted / 'logs/pytest.log'
          accepted = trusted / 'evidence/pytest.xml'
          try:
              result = verifier.run_trusted_pytest_lane(
                  repo_root=repo,
                  pytest_args=('-p', 'no:cacheprovider', 'tests'),
                  env=env,
                  log_path=log,
                  accepted_junit_path=accepted,
                  worker_path=root / 'scripts/baseline/run_pytest_lane.py',
                  timeout_seconds=30,
                  tools=tools,
                  trusted_root=trusted,
              )
              print('RESULT', result.exit_code)
              print(accepted.read_text(encoding='utf-8'))
          except BaseException:
              print('=== AUTHENTICATED WORKER LOG ===')
              print(log.read_text(encoding='utf-8', errors='replace') if log.exists() else '<missing>')
              raise
          PY
