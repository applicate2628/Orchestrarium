name: PR4 native Windows owner diagnostic
on:
  push:
    branches: [automation/pr4-audit-20260905-final]
    paths: [.github/workflows/pr4-windows-owner-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c605a46bf40055f6d8c296594230cd8c70c18cc2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect disposable owned fixtures and native identity
        shell: python
        run: |
          import ctypes, json, os, sys, tempfile, traceback
          from pathlib import Path
          from ctypes import wintypes as w
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from provider_prompt import WindowsPrivateObjectOwnerV1 as Owner
          from process_supervision.process_runner import bind_cwd_identity
          a = ctypes.WinDLL('advapi32', use_last_error=True)
          k = ctypes.WinDLL('kernel32', use_last_error=True)
          k.LocalFree.argtypes = [ctypes.c_void_p]
          k.LocalFree.restype = ctypes.c_void_p
          a.GetNamedSecurityInfoW.argtypes = [w.LPWSTR,ctypes.c_int,w.DWORD,ctypes.POINTER(ctypes.c_void_p),ctypes.c_void_p,ctypes.POINTER(ctypes.c_void_p),ctypes.c_void_p,ctypes.POINTER(ctypes.c_void_p)]
          a.GetNamedSecurityInfoW.restype = w.DWORD
          a.ConvertSecurityDescriptorToStringSecurityDescriptorW.argtypes = [ctypes.c_void_p,w.DWORD,w.DWORD,ctypes.POINTER(w.LPWSTR),ctypes.POINTER(w.DWORD)]
          a.ConvertSecurityDescriptorToStringSecurityDescriptorW.restype = w.BOOL
          def describe(path):
              sd=ctypes.c_void_p(); owner=ctypes.c_void_p(); acl=ctypes.c_void_p(); rendered=w.LPWSTR()
              status=a.GetNamedSecurityInfoW(str(path),1,5,ctypes.byref(owner),None,ctypes.byref(acl),None,ctypes.byref(sd))
              if status: return {'read_status':status}
              try:
                  if not a.ConvertSecurityDescriptorToStringSecurityDescriptorW(sd,1,5,ctypes.byref(rendered),None):
                      return {'render_error':ctypes.get_last_error()}
                  return {'security_descriptor':rendered.value}
              finally:
                  if rendered: k.LocalFree(rendered)
                  if sd: k.LocalFree(sd)
          result = {'python':sys.version,'cwd_security':describe(Path.cwd())}
          def attempt(name, fn):
              try: result[name]=str(fn())
              except Exception as exc: result[name]={'type':type(exc).__name__,'error':str(exc),'trace':traceback.format_exc()}
          with tempfile.TemporaryDirectory(prefix='pr4-audit-owned-') as tmp:
              root=Path(tmp).resolve(); target=root/'private'; target.mkdir()
              desc,expected=Owner.current_user_security_descriptor(); k.LocalFree(desc)
              result['expected_dacl']=expected
              result['before']=describe(target)
              attempt('cwd_binding_root',lambda:bind_cwd_identity(str(Path.cwd())))
              attempt('cwd_binding_temp',lambda:bind_cwd_identity(str(target)))
              attempt('protection',lambda:Owner.protect_and_verify(target,directory=True))
              result['after']=describe(target)
              fixture=root/'sample'; fixture.write_bytes(b'fixture')
              before=fixture.stat()
              with fixture.open('rb') as stream: opened=os.fstat(stream.fileno())
              result['metadata']={field:[getattr(before,field,None),getattr(opened,field,None)] for field in ('st_dev','st_ino','st_mode','st_ctime_ns','st_birthtime_ns','st_mtime_ns','st_file_attributes')}
              result['temp_spelling_resolves']=str(Path(tmp))==str(root)
          Path('windows-owner-diagnostic.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr4-windows-owner-diagnostic
          path: windows-owner-diagnostic.json
          if-no-files-found: error
          retention-days: 1
