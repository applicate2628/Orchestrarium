name: Verify V2 documentation follow-up
on:
  push:
    branches: [automation/pr-cleanup-finish-20260905]
    paths: ['.github/workflows/pr8-documentation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3c6bb7b0da7dbe33b56fdfc2b4dde358f914b694
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2a00a4f70b19db5c04bb52f1b103b69bd635df67
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5 pytest-subtests==0.14.2 PyYAML==6.0.2 "jsonschema[format]==4.23.0"
      - name: Apply only exact reviewed documents and tests
        id: prepare
        working-directory: target
        shell: python
        run: |
          import glob, hashlib, os, subprocess, sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '2a00a4f70b19db5c04bb52f1b103b69bd635df67'
          assert git('rev-parse', 'HEAD') == base
          payload = Path('../control/.github/audit/pr8-documentation.patch').read_bytes()
          # Repair the one copied diff-header indent, then require exact local bytes.
          payload = payload.replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(payload).hexdigest() == '33048422f5d0b4ee2effbc590198ff74b9819230c5b1d5a4e6b5e25d9c7352ab'
          patch = Path(os.environ['RUNNER_TEMP']) / 'reviewed-documents.patch'
          patch.write_bytes(payload)
          git('apply', '--check', str(patch))
          git('apply', str(patch))
          git('add', '--all')
          expected = {
              'docs/model-routing-v2/README.md': 'e16ba372bb5f4d8e6873c98536b3e7493a86fd3f',
              'docs/superpowers/plans/2026-09-04-adaptive-lead-model-routing-v2-implementation.md': '383caec6209b0bbc6772fa8af9852582833daa24',
              'docs/superpowers/specs/2026-09-04-adaptive-lead-model-routing-v2-design.md': 'fceb83644123097231265c2afc1845ba1ae7dab8',
              'tests/test_adaptive_model_routing_v2_documentation_alignment.py': 'ef15264a8a26758d7274226d7bda9813846aebdb',
              'tests/test_adaptive_model_routing_v2_validation_example.py': 'dc37649b722b7628b44db5eb19860a6ee97590e9',
          }
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(expected)
          for path, digest in expected.items():
              assert git('rev-parse', ':' + path) == digest, path
          files = sorted(glob.glob('tests/test_astra_routing_v1*.py') + glob.glob('tests/test_lead_worker_routing_v1*.py') + glob.glob('tests/test_adaptive_model_routing_v2*.py'))
          subprocess.run([sys.executable, '-m', 'pytest', '-q', '-ra', *files], check=True, timeout=180)
          subprocess.run([sys.executable, 'scripts/check-publication-gate.py', '--release-notes-exempt', 'Documentation-only alignment with existing schema behavior and an executable validation example; no runtime, schema, admission or installation change.'], check=True, timeout=90)
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('switch', '-c', 'automation/pr8-validated-guide-20260905')
          git('commit', '-m', 'docs(v2): validate declared records and align existing admission rules')
          sha = git('rev-parse', 'HEAD')
          git('push', 'origin', 'HEAD:refs/heads/automation/pr8-validated-guide-20260905')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + sha + '\n')
          print('CANDIDATE=' + sha)
  native:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5 pytest-subtests==0.14.2 PyYAML==6.0.2 "jsonschema[format]==4.23.0"
      - name: Verify the exact candidate twice
        shell: python
        run: |
          import glob, json, os, subprocess, sys
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_HEAD']
          out = Path(os.environ['RUNNER_TEMP']) / 'v2-documentation'
          out.mkdir()
          files = sorted(glob.glob('tests/test_astra_routing_v1*.py') + glob.glob('tests/test_lead_worker_routing_v1*.py') + glob.glob('tests/test_adaptive_model_routing_v2*.py'))
          statuses = []
          for ordinal, selected in enumerate((files, list(reversed(files)))):
              result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-ra', '--tb=short', *selected], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
              (out / f'tests-{ordinal}.log').write_bytes(result.stdout)
              print(result.stdout.decode('utf-8', errors='replace'))
              statuses.append(result.returncode)
          (out / 'result.json').write_text(json.dumps({'head': os.environ['EXPECTED_HEAD'], 'platform': sys.platform, 'exit_codes': statuses}, indent=2), encoding='utf-8')
          raise SystemExit(1 if any(statuses) else 0)
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-documentation-${{ matrix.os }}
          path: ${{ runner.temp }}/v2-documentation/
          if-no-files-found: error
          retention-days: 3
