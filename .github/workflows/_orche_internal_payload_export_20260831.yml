name: Internal PR2 payload audit

on:
  push:
    branches:
      - orche/internal-pr2-publish-20260831-r3

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orche/internal-pr2-publish-20260831-r3
          fetch-depth: 1
      - uses: actions/upload-artifact@v4
        with:
          name: pr2-helper-payload-audit
          path: .orche-payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
