name: PR 4 exact-source export

on:
  push:
    branches:
      - automation/pr4-audit-verify-20260906-d6388462
    paths:
      - .github/workflows/pr4-exact-source-export.yml

permissions:
  contents: read

concurrency:
  group: pr4-exact-source-export-20260906
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'applicate2628/Orchestrarium'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR source without stored credentials
        uses: actions/checkout@v4
        with:
          ref: d63884623f73b748618f47cba142faea537338be
          fetch-depth: 0
          persist-credentials: false
      - name: Export complete Git objects for verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d63884623f73b748618f47cba142faea537338be
          test -z "$(git status --porcelain)"
          mkdir -p "${RUNNER_TEMP}/pr4-source"
          git bundle create "${RUNNER_TEMP}/pr4-source/source.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/pr4-source/source.bundle"
          git rev-parse HEAD > "${RUNNER_TEMP}/pr4-source/HEAD.txt"
          cd "${RUNNER_TEMP}/pr4-source"
          sha256sum source.bundle > SHA256SUMS
      - name: Store exact source for this audit
        uses: actions/upload-artifact@v4
        with:
          name: pr4-exact-source-d6388462
          path: ${{ runner.temp }}/pr4-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
