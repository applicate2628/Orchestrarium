name: Temporary PR2 recovery export

on:
  push:
    branches:
      - orche/internal-pr2-recovery-export-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create branch bundle
        run: git bundle create /tmp/orchestrarium-pr2-recovery.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrarium-pr2-recovery
          path: /tmp/orchestrarium-pr2-recovery.bundle
          if-no-files-found: error
          retention-days: 1
