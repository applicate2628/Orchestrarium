name: PR 4 native admission diagnostic

on:
  push:
    branches: [automation/pr4-audit-resume-20260906]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d63884623f73b748618f47cba142faea537338be
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Inspect source and runtime directory ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          (Get-Acl target).Owner
          $temporary = Join-Path $env:RUNNER_TEMP 'pr4-owner-diagnostic'
          New-Item -ItemType Directory -Path $temporary | Out-Null
          (Get-Acl $temporary).Owner
          python control/.github/audit/pr4_diagnostic.py target evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr4-native-admission-diagnostic
          path: evidence/
          if-no-files-found: error
          retention-days: 7
