name: PR4 Windows security observations
on:
  push:
    branches: [automation/pr4-audit-20260905-d6388462]
    paths: [.github/workflows/pr4-windows-security-observe.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d63884623f73b748618f47cba142faea537338be
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
      - name: Observe current-user-owned disposable objects without weakening checks
        shell: python
        run: |
          import dataclasses, importlib.util, json, os, subprocess, sys, tempfile, traceback
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          out = Path(os.environ['RUNNER_TEMP']) / 'security-observations'
          out.mkdir()
          log = (out/'observations.txt').open('w',encoding='utf-8')
          def emit(*args):
              print(*args,file=log,flush=True)
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              module=importlib.util.module_from_spec(spec); sys.modules[name]=module
              spec.loader.exec_module(module); return module
          def trace(frame,event,arg):
              if event=='exception' and any(s in frame.f_code.co_filename for s in ('process_runner.py','provider_prompt.py')):
                  typ,exc,_=arg
                  if issubclass(typ,(ValueError,OSError)):
                      emit('EXCEPTION',Path(frame.f_code.co_filename).name,frame.f_code.co_name,frame.f_lineno,typ.__name__,str(exc))
                      if frame.f_code.co_name=='verify_handle_dacl':
                          emit('EXPECTED_DACL',frame.f_locals.get('expected_sddl'))
                          rendered=frame.f_locals.get('rendered')
                          emit('OBSERVED_DACL',getattr(rendered,'value',None))
              return trace
          fixture=load('tests/test_process_runner_windows_runtime.py','diag_fixture')
          runner=fixture._load_runner()
          provider=load('scripts/provider_prompt.py','diag_provider')
          with tempfile.TemporaryDirectory(prefix='pr4-owned-observe-') as td:
              root=Path(td).resolve()
              script=out/'own-disposable-directory.ps1'
              script.write_text("param([string]$Target)\n$ErrorActionPreference='Stop'\n$id=[System.Security.Principal.WindowsIdentity]::GetCurrent()\n$acl=Get-Acl -LiteralPath $Target\nWrite-Output ('BEFORE_OWNER '+$acl.Owner)\nWrite-Output ('USER '+$id.User.Value)\n$acl.SetOwner($id.User)\nSet-Acl -LiteralPath $Target -AclObject $acl\nWrite-Output ('AFTER_OWNER '+(Get-Acl -LiteralPath $Target).Owner)\n",encoding='utf-8')
              result=subprocess.run(['pwsh','-NoProfile','-File',str(script),str(root)],capture_output=True,text=True,encoding='utf-8',check=True)
              emit(result.stdout,result.stderr)
              sys.settrace(trace)
              try:
                  request=fixture._request(runner,(str(Path(sys.executable).resolve()),str(fixture.CHILD),'marker','--marker',str(root/'marker'),'--token','complete'))
                  request=dataclasses.replace(request,cwd=str(root))
                  emit('OWNED_CWD_PROCESS_RESULT',repr(runner.ProcessRunnerV1().run(request)))
              finally:
                  sys.settrace(None)
              receipt=None
              sys.settrace(trace)
              try:
                  receipt=provider.TerminalReceiptV1.reserve(root/'terminal.receipt')
                  emit('RECEIPT_RESERVED',type(receipt).__name__)
              except Exception:
                  traceback.print_exc(file=log)
              finally:
                  sys.settrace(None)
                  if receipt is not None: receipt.close()
          log.close()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr4-windows-security-observations
          path: ${{ runner.temp }}/security-observations/
          retention-days: 5
          if-no-files-found: error
