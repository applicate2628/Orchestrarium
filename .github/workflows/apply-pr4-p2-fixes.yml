name: Deep audit PR 4

on:
  push:
    branches: [automation/pr4-p2-push-20260903-14fc38c4]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: d30398ce559265bd79b12a021bddaea373f251fa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Static Python checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts src.codex src.claude tests
          git diff --check
      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests
      - name: Provider validators
        shell: bash
        run: |
          set -euo pipefail
          python src.codex/skills/lead/scripts/validate-skill-pack.py
          python src.claude/agents/scripts/validate-skill-pack.py
      - name: Mirror and critical-file equality
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent scripts/universal-hooks/scripts/check-publication-safety.py src.codex/skills/lead/scripts/check-publication-safety.py
          cmp --silent scripts/universal-hooks/scripts/check-publication-safety.py src.claude/agents/scripts/check-publication-safety.py
          cmp --silent scripts/universal-hooks/scripts/hook_common.py src.codex/skills/lead/scripts/hook_common.py
          cmp --silent scripts/universal-hooks/scripts/hook_common.py src.claude/agents/scripts/hook_common.py
          cmp --silent scripts/universal-hooks/scripts/mcp_continuity_policy.py src.codex/skills/lead/scripts/mcp_continuity_policy.py
          cmp --silent scripts/universal-hooks/scripts/mcp_continuity_policy.py src.claude/agents/scripts/mcp_continuity_policy.py
          cmp --silent src.codex/skills/github-pr-review-bot/SKILL.md src.claude/skills/github-pr-review-bot/SKILL.md
