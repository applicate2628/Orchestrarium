name: Internal PR2 source export

on:
  push:
    branches:
      - orche/internal-pr2-export-20260830-final

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create repository bundle
        run: git bundle create orchestrarium.bundle --all
      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: orchestrarium-pr2-e348-bundle
          path: orchestrarium.bundle
          if-no-files-found: error
          retention-days: 1
