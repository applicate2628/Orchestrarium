name: Internal reviewed branch export

on:
  push:
    branches:
      - orche/internal-pr2-export-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Git bundle
        run: git bundle create /tmp/orchestrarium.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrarium-reviewed-bundle
          path: /tmp/orchestrarium.bundle
          compression-level: 0
          retention-days: 1
