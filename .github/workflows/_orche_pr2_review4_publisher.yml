name: Internal PR2 skip-evidence publisher

on:
  push:
    branches:
      - orche/internal-pr2-review4-20260831

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout helper payload
        uses: actions/checkout@v4
        with:
          ref: orche/internal-pr2-review4-20260831
          path: helper
          fetch-depth: 1

      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: orche/impl-000-baseline
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Install test dependencies
        run: |
          python3 -m venv --copies /tmp/orche-skip-review-venv
          /tmp/orche-skip-review-venv/bin/python -m pip install --disable-pip-version-check pytest PyYAML
          echo "/tmp/orche-skip-review-venv/bin" >> "$GITHUB_PATH"

      - name: Add regression, verify red, implement, verify green, and publish
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export TERM=dumb

          python3 - <<'PY'
          from pathlib import Path
          path = Path("helper/.orche-payload/fix_skip_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = '    r"\\bin\\s+\\d+(?:\\.\\d+)?s(?:\\s+\\([^)]*\\))?\\s*$"\n'
          new = '    r"\\bin\\s+\\d+(?:\\.\\d+)?s\\b"\n'
          if old not in text:
              raise SystemExit("cannot locate terminal-duration pattern")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 helper/.orche-payload/fix_skip_evidence.py repo

          cd repo
          cmp scripts/baseline/stage0_evidence.py \
              baseline/orchestrarium-v1/tooling/stage0_evidence.py

          for test_file in \
            tests/test_orche_baseline_pin.py \
            tests/test_orche_pytest_baseline.py \
            tests/test_orche_baseline_inventory.py \
            tests/test_orche_target_effect_baseline.py \
            tests/test_orche_command_baseline.py \
            tests/test_orche_capability_baseline.py \
            tests/test_orche_verifier_isolation.py \
            tests/test_orche_review_regressions.py; do
            python3 "$test_file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          import tempfile

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "*.py"], text=True
          ).splitlines()
          for name in changed:
              source = Path(name).read_text(encoding="utf-8")
              compile(source, name, "exec")

          pin = json.loads(
              Path("baseline/orchestrarium-v1/baseline-pin.json").read_text()
          )
          record = pin["tooling"]["stage0Evidence"]
          actual = subprocess.check_output(
              ["git", "hash-object", record["path"]], text=True
          ).strip()
          assert actual == record["gitBlobSha"], (
              actual,
              record["gitBlobSha"],
          )

          readme = Path(
              "baseline/orchestrarium-v1/README.md"
          ).read_text(encoding="utf-8")
          match = re.search(r"```bash\n(.*?)\n```", readme, re.S)
          assert match
          with tempfile.NamedTemporaryFile(
              "w", suffix=".sh", delete=False
          ) as handle:
              handle.write(match.group(1) + "\n")
              shell_path = handle.name
          subprocess.run(["bash", "-n", shell_path], check=True)
          PY

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A

          expected_paths=$(cat <<'EOF'
          RELEASE_NOTES.md
          baseline/orchestrarium-v1/README.md
          baseline/orchestrarium-v1/baseline-pin.json
          baseline/orchestrarium-v1/tooling/stage0_evidence.py
          scripts/baseline/stage0_evidence.py
          tests/test_orche_verifier_isolation.py
          EOF
          )
          diff -u <(printf '%s\n' "$expected_paths" | sort) \
            <(git diff --cached --name-only | sort)
          git diff --cached --check
          python3 scripts/check-publication-gate.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(stage0): preserve synthesized pytest skips'
          git push origin HEAD:orche/impl-000-baseline
          echo "published_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
