name: PR 4 exact audit source snapshot

on:
  push:
    branches: [automation/pr4-audit-20260905-final]
    paths: [.github/workflows/pr4-audit-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'applicate2628/Orchestrarium'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d63884623f73b748618f47cba142faea537338be
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source objects without credentials or runtime state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d63884623f73b748618f47cba142faea537338be
          git cat-file -e c605a46bf40055f6d8c296594230cd8c70c18cc2^{commit}
          mkdir audit-export
          git branch audit-source d63884623f73b748618f47cba142faea537338be
          git branch audit-candidate c605a46bf40055f6d8c296594230cd8c70c18cc2
          git bundle create audit-export/source.bundle audit-source audit-candidate
          git bundle verify audit-export/source.bundle
          git diff --binary d63884623f73b748618f47cba142faea537338be c605a46bf40055f6d8c296594230cd8c70c18cc2 > audit-export/previous-candidate.patch
          git show --no-patch --format=fuller audit-source audit-candidate > audit-export/revisions.txt
          sha256sum audit-export/* > audit-export/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr4-exact-source-bundle
          path: audit-export/
          if-no-files-found: error
          retention-days: 1
