name: Orche PR2 verify second review fixes

on:
  push:
    branches:
      - orche/impl-000-baseline

permissions:
  contents: write

concurrency:
  group: orche-pr2-verify-second-review
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: orche/impl-000-baseline
          fetch-depth: 0

      - name: Add Qwen entrypoint and immutable tool pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          target = Path('scripts/baseline/build_target_effect_baseline.py')
          text = target.read_text(encoding='utf-8')
          old = '        "claude.md",\n        "gemini.md",\n'
          new = '        "claude.md",\n        "gemini.md",\n        "qwen.md",\n'
          if old not in text:
              raise SystemExit('target-effect instruction-entrypoint marker missing')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')

          pin_test = Path('tests/test_orche_baseline_pin.py')
          pin_text = pin_test.read_text(encoding='utf-8')
          pin_test.write_text(
              pin_text.replace(
                  'self.assertIn("git cat-file blob", readme)',
                  'self.assertIn("cat-file blob", readme)',
                  1,
              ),
              encoding='utf-8',
          )

          tooling_paths = {
              'inventoryGenerator': 'scripts/baseline/build_inventory.py',
              'targetEffectGenerator': 'scripts/baseline/build_target_effect_baseline.py',
              'pytestComparator': 'scripts/baseline/compare_pytest_baseline.py',
              'commandComparator': 'scripts/baseline/compare_command_baseline.py',
          }
          tooling = {}
          for name, path in tooling_paths.items():
              blob = subprocess.check_output(
                  ['git', 'hash-object', '-w', path], text=True
              ).strip()
              tooling[name] = {
                  'path': path,
                  'gitBlobSha': blob,
                  'materialization': 'git-cat-file-blob',
                  'deterministic': True,
                  'runtimeMutation': False,
              }

          payload = {
              'baseline': {
                  'commitSha': 'ce2052fb773576fd6e3206c2a7e21e01852d556b',
                  'repository': 'applicate2628/Orchestrarium',
                  'requestedRef': 'ce2052fb773576fd6e3206c2a7e21e01852d556b',
                  'sourceBranch': 'main',
                  'sourceBranchHeadAtCapture': 'ce2052fb773576fd6e3206c2a7e21e01852d556b',
                  'treeSha': '04dccf4575f17c9c5533474d2e0fd1503bfeceb7',
              },
              'evidence': {
                  'commitGeneratedOutputs': False,
                  'generatedOutputDirectory': '.scratch/orche-stage0/orchestrarium-v1',
                  'requiredGeneratedOutputs': [
                      'baseline-manifest.json',
                      'capability-inventory.json',
                      'summary.md',
                      'target-effect-baseline.json',
                      'test-inventory.json',
                  ],
                  'verificationMode': 'local-only',
              },
              'schemaVersion': 3,
              'signedTag': {
                  'name': 'orchestrarium-v1-parity-baseline',
                  'required': True,
                  'status': 'human-gate-pending',
              },
              'status': 'baseline-identity-and-tooling-pinned',
              'tooling': tooling,
          }
          Path('baseline/orchestrarium-v1/baseline-pin.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Run focused Stage 0 tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_orche_baseline_pin.py
          python tests/test_orche_pytest_baseline.py
          python tests/test_orche_baseline_inventory.py
          python tests/test_orche_target_effect_baseline.py
          python tests/test_orche_command_baseline.py
          python -m compileall -q scripts/baseline tests/test_orche_*.py

      - name: Run differential validators in isolated homes
        shell: bash
        run: |
          set -euo pipefail
          baseline_root="$RUNNER_TEMP/orche-baseline"
          output_root="$RUNNER_TEMP/orche-differential"
          candidate_root="$PWD"
          git worktree add --detach "$baseline_root" ce2052fb773576fd6e3206c2a7e21e01852d556b
          cleanup() { git worktree remove --force "$baseline_root" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          baseline_ref="$(git -C "$baseline_root" rev-parse HEAD)"
          baseline_tree="$(git -C "$baseline_root" rev-parse 'HEAD^{tree}')"
          candidate_ref="$(git -C "$candidate_root" rev-parse HEAD)"
          test "$baseline_ref" = ce2052fb773576fd6e3206c2a7e21e01852d556b
          test "$baseline_tree" = 04dccf4575f17c9c5533474d2e0fd1503bfeceb7

          run_isolated() {
            lane="$1"; repo="$2"; shift 2
            lane_root="$output_root/$lane"
            rm -rf "$lane_root"
            mkdir -p "$lane_root/home" "$lane_root/tmp" "$lane_root/appdata" \
              "$lane_root/localappdata" "$lane_root/xdg-config" "$lane_root/xdg-cache" \
              "$lane_root/xdg-data" "$lane_root/xdg-state" "$lane_root/codex" \
              "$lane_root/claude" "$lane_root/gemini" "$lane_root/qwen" "$lane_root/kimi"
            : > "$lane_root/gitconfig"
            (cd "$repo" && env -i PATH="$PATH" LANG=C LC_ALL=C \
              HOME="$lane_root/home" USERPROFILE="$lane_root/home" \
              APPDATA="$lane_root/appdata" LOCALAPPDATA="$lane_root/localappdata" \
              XDG_CONFIG_HOME="$lane_root/xdg-config" XDG_CACHE_HOME="$lane_root/xdg-cache" \
              XDG_DATA_HOME="$lane_root/xdg-data" XDG_STATE_HOME="$lane_root/xdg-state" \
              CODEX_HOME="$lane_root/codex" CLAUDE_CONFIG_DIR="$lane_root/claude" \
              GEMINI_HOME="$lane_root/gemini" QWEN_CODE_HOME="$lane_root/qwen" \
              KIMI_CODE_HOME="$lane_root/kimi" TMPDIR="$lane_root/tmp" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL="$lane_root/gitconfig" \
              PYTHONDONTWRITEBYTECODE=1 PYTHONUTF8=1 CI=1 "$@")
          }

          compare_one() {
            name="$1"; shift
            mkdir -p "$output_root"
            set +e
            run_isolated "$name-baseline" "$baseline_root" "$@" >"$output_root/$name-baseline.log" 2>&1
            baseline_exit=$?
            run_isolated "$name-candidate" "$candidate_root" "$@" >"$output_root/$name-candidate.log" 2>&1
            candidate_exit=$?
            set -e
            volatile_args=()
            if [ "$name" = agents-mode-installers ]; then
              volatile_args=(--volatile-pattern 'agents-mode-installer-regression[/\\][0-9a-f]{32}')
            fi
            python scripts/baseline/compare_command_baseline.py \
              --name "$name" \
              --baseline-exit "$baseline_exit" --candidate-exit "$candidate_exit" \
              --baseline-log "$output_root/$name-baseline.log" \
              --candidate-log "$output_root/$name-candidate.log" \
              --baseline-root "$baseline_root" --candidate-root "$candidate_root" \
              --baseline-ref "$baseline_ref" --candidate-ref "$candidate_ref" \
              --output "$output_root/$name.json" "${volatile_args[@]}"
          }

          compare_one agents-spine \
            python scripts/validate-agents-spine.py --spine shared/AGENTS.shared.md
          compare_one universal-hooks \
            python scripts/sync-universal-hooks.py --check
          compare_one agents-mode-installers \
            python scripts/validate-agents-mode-installers.py --root .

      - name: Commit verified fixes and remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_orche_pr2_verify2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseline/orchestrarium-v1 scripts/baseline tests .github/workflows/_orche_pr2_verify2.yml
          git diff --cached --check
          git commit -m 'fix: pin and isolate Stage 0 verification'
          git push origin HEAD:orche/impl-000-baseline
