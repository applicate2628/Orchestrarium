name: PR10 exact-head finalization

on:
  push:
    branches:
      - automation/pr10-finalize-1f31e84

permissions:
  contents: write

concurrency:
  group: pr10-exact-head-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: hotfix/lifecycle-successor-transfer
      EXPECTED_HEAD: 1f31e84d043607c2e41c72c80e16b72d965fe3e5
      AUTOMATION_BRANCH: automation/pr10-finalize-1f31e84
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: hotfix/lifecycle-successor-transfer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authority and install test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          python -m pip install --disable-pip-version-check pytest
          git status --short

      - name: Capture exact-head full-suite baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=/tmp/pr10-baseline.xml > /tmp/pr10-baseline.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/pr10-baseline.rc
          tail -n 80 /tmp/pr10-baseline.log
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Apply one-owner corrections and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              write(path, text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{path}: start marker missing: {start!r}")
              last = text.find(end, first)
              if last < 0:
                  raise SystemExit(f"{path}: end marker missing: {end!r}")
              write(path, text[:first] + replacement + text[last:])

          gate = "scripts/universal-hooks/scripts/check-git-push-gate.py"
          replace_between(
              gate,
              "def _stream_stable_pr_grant(\n",
              "\n\ndef _recover_stable_pr_grant(",
              '''def _stream_stable_pr_grant(
              transcript_path: str, envelope_repository_workdir: str
          ) -> tuple[str, ActivePrGrant | SimplePrIntent | None, str]:
              """Reduce one complete, identity-stable JSONL transcript."""

              if not transcript_path:
                  return "absent", None, HISTORY_STATUS_ABSENT
              path = Path(transcript_path)
              reducer = _PrGrantReducer(envelope_repository_workdir)
              try:
                  path_before = path.stat()
                  with path.open("rb") as stream:
                      before = os.fstat(stream.fileno())
                      identity_fields = ("st_dev", "st_ino", "st_mode")
                      if tuple(getattr(before, name) for name in identity_fields) != tuple(
                          getattr(path_before, name) for name in identity_fields
                      ):
                          return "absent", None, HISTORY_STATUS_IDENTITY_DRIFT
                      if before.st_size > TRANSCRIPT_RECOVERY_BYTE_CAP:
                          return "absent", None, HISTORY_STATUS_LIMIT
                      total_bytes = 0
                      total_records = 0
                      content_digest = hashlib.sha256()
                      while True:
                          raw_line = stream.readline(min(
                              TRANSCRIPT_HISTORY_LINE_BYTE_CAP,
                              TRANSCRIPT_RECOVERY_BYTE_CAP - total_bytes,
                          ) + 1)
                          if not raw_line:
                              break
                          total_bytes += len(raw_line)
                          total_records += 1
                          content_digest.update(raw_line)
                          if (
                              len(raw_line) > TRANSCRIPT_HISTORY_LINE_BYTE_CAP
                              or total_bytes > TRANSCRIPT_RECOVERY_BYTE_CAP
                              or total_records > TRANSCRIPT_RECOVERY_RECORD_CAP
                          ):
                              return "absent", None, HISTORY_STATUS_LIMIT
                          if not raw_line.strip():
                              continue
                          try:
                              entry = json.loads(raw_line.decode("utf-8", errors="strict"))
                          except (UnicodeDecodeError, json.JSONDecodeError):
                              return "absent", None, HISTORY_STATUS_INVALID
                          if not isinstance(entry, dict):
                              return "absent", None, HISTORY_STATUS_INVALID
                          reducer.consume(entry, raw_line)
                      first_digest = content_digest.digest()
                      after = os.fstat(stream.fileno())
                      stream.seek(0)
                      verify_digest = hashlib.sha256()
                      verify_bytes = 0
                      while True:
                          remaining = TRANSCRIPT_RECOVERY_BYTE_CAP - verify_bytes
                          chunk = stream.read(min(1024 * 1024, remaining) + 1)
                          if not chunk:
                              break
                          verify_bytes += len(chunk)
                          if verify_bytes > TRANSCRIPT_RECOVERY_BYTE_CAP:
                              return "absent", None, HISTORY_STATUS_LIMIT
                          verify_digest.update(chunk)
                      after_verify = os.fstat(stream.fileno())
                      current = path.stat()
              except PrRouteDenied:
                  raise
              except Exception:
                  return "absent", None, HISTORY_STATUS_UNREADABLE

              stable_fields = (
                  "st_dev", "st_ino", "st_mode", "st_size", "st_mtime_ns", "st_ctime_ns"
              )
              descriptor_before = tuple(getattr(before, name) for name in stable_fields)
              if (
                  descriptor_before != tuple(getattr(after, name) for name in stable_fields)
                  or descriptor_before
                  != tuple(getattr(after_verify, name) for name in stable_fields)
                  or tuple(getattr(path_before, name) for name in stable_fields)
                  != tuple(getattr(current, name) for name in stable_fields)
                  or total_bytes != verify_bytes
                  or first_digest != verify_digest.digest()
              ):
                  return "absent", None, HISTORY_STATUS_IDENTITY_DRIFT
              state, grant = reducer.finish()
              return state, grant, HISTORY_STATUS_FOUND
          ''',
          )
          replace_between(
              gate,
              "def _read_binding_state(path: Path) -> PrBindingState | None:\n",
              "\n\ndef _write_binding_state(",
              '''def _read_binding_state(path: Path) -> PrBindingState | None:
              try:
                  observed = path.lstat()
              except FileNotFoundError:
                  return None
              except OSError:
                  raise PrRouteDenied("PRG-AUTH-MALFORMED") from None
              if (
                  not stat.S_ISREG(observed.st_mode)
                  or stat.S_ISLNK(observed.st_mode)
                  or observed.st_nlink != 1
                  or observed.st_size > PR_BINDING_SIDECAR_BYTE_CAP
                  or bool(
                      getattr(observed, "st_file_attributes", 0)
                      & getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0)
                  )
              ):
                  raise PrRouteDenied("PRG-AUTH-MALFORMED")
              try:
                  with path.open("rb") as stream:
                      opened = os.fstat(stream.fileno())
                      identity_fields = ("st_dev", "st_ino", "st_mode", "st_nlink")
                      if tuple(getattr(opened, name) for name in identity_fields) != tuple(
                          getattr(observed, name) for name in identity_fields
                      ):
                          raise PrRouteDenied("PRG-AUTH-MALFORMED")
                      raw = stream.read(PR_BINDING_SIDECAR_BYTE_CAP + 1)
                      after_read = os.fstat(stream.fileno())
                      stream.seek(0)
                      verified = stream.read(PR_BINDING_SIDECAR_BYTE_CAP + 1)
                      after_verify = os.fstat(stream.fileno())
                  if len(raw) > PR_BINDING_SIDECAR_BYTE_CAP:
                      raise PrRouteDenied("PRG-AUTH-MALFORMED")
                  current = path.lstat()
                  stable_fields = (
                      "st_dev", "st_ino", "st_mode", "st_nlink", "st_size",
                      "st_mtime_ns", "st_ctime_ns",
                  )
                  opened_fields = tuple(getattr(opened, name) for name in stable_fields)
                  if (
                      opened_fields
                      != tuple(getattr(after_read, name) for name in stable_fields)
                      or opened_fields
                      != tuple(getattr(after_verify, name) for name in stable_fields)
                      or tuple(getattr(observed, name) for name in stable_fields)
                      != tuple(getattr(current, name) for name in stable_fields)
                      or raw != verified
                      or len(raw) != opened.st_size
                  ):
                      raise PrRouteDenied("PRG-AUTH-MALFORMED")
                  value = json.loads(raw.decode("utf-8", errors="strict"))
              except PrRouteDenied:
                  raise
              except Exception:
                  raise PrRouteDenied("PRG-AUTH-MALFORMED") from None
              return _validate_binding_payload(value)
          ''',
          )

          mutate = "scripts/mutate-work-item.py"
          replace_once(
              mutate,
              '''def _lifecycle_file_identity(info: os.stat_result) -> tuple[int, int]:
              return info.st_dev, info.st_ino


          ''',
              '''def _lifecycle_file_identity(info: os.stat_result) -> tuple[int, int]:
              return info.st_dev, info.st_ino


          def _lifecycle_file_snapshot_key(info: os.stat_result) -> tuple[int, ...]:
              return (
                  info.st_dev,
                  info.st_ino,
                  info.st_mode,
                  info.st_nlink,
                  info.st_size,
                  info.st_mtime_ns,
                  info.st_ctime_ns,
              )


          ''',
          )
          replace_once(
              mutate,
              '''LEDGER_LOCATION_INTENT_MAX_FILES = 1024
          LEDGER_LOCATION_INTENT_MAX_FILE_BYTES = 256 * 1024
          LEDGER_LOCATION_INTENT_MAX_TOTAL_BYTES = 8 * 1024 * 1024
          ''',
              '''TRANSITION_INTENT_INVENTORY_MAX_ENTRIES = 1024
          TRANSITION_INTENT_FILE_BYTE_CAP = 256 * 1024
          TRANSITION_INTENT_INVENTORY_BYTE_CAP = 8 * 1024 * 1024
          LEDGER_LOCATION_PROOF_BYTE_CAP = 4 * 1024 * 1024
          ''',
          )
          replace_once(
              mutate,
              '''class CapturedFileSnapshot:
              path: Path
              identity: tuple[int, int]
              length: int
              data: bytes
              parent_chain: CapturedPathParentChain
          ''',
              '''class CapturedFileSnapshot:
              path: Path
              identity: tuple[int, int]
              length: int
              data: bytes
              parent_chain: CapturedPathParentChain
              require_single_link: bool = False
          ''',
          )
          replace_once(
              mutate,
              '''BUG_SUPERSESSION_INVENTORY_LINK_FIELDS = {
              "path", "beforeSha256", "afterSha256", "afterBytesBase64",
          }


          def _validate_transfer_migration_receipt_bindings(
          ''',
              '''BUG_SUPERSESSION_INVENTORY_LINK_FIELDS = {
              "path", "beforeSha256", "afterSha256", "afterBytesBase64",
          }


          def _bounded_transition_intent_inventory(
              directory: Path, *, failure_id: str, unreadable: str
          ) -> list[Path]:
              """Inventory transition intents within finite count and byte budgets."""
              candidates: list[Path] = []
              total_bytes = 0
              json_suffix = os.path.normcase(".json")
              try:
                  with os.scandir(directory) as entries:
                      for entry_count, entry in enumerate(entries, start=1):
                          if entry_count > TRANSITION_INTENT_INVENTORY_MAX_ENTRIES:
                              raise LifecycleError(
                                  failure_id, "transition intent inventory limit exceeded"
                              )
                          if not os.path.normcase(entry.name).endswith(json_suffix):
                              continue
                          path = Path(entry.path)
                          metadata = path.lstat()
                          if (
                              not stat.S_ISREG(metadata.st_mode)
                              or stat.S_ISLNK(metadata.st_mode)
                              or metadata.st_nlink != 1
                              or bool(
                                  getattr(metadata, "st_file_attributes", 0)
                                  & getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0)
                              )
                          ):
                              raise LifecycleError(
                                  failure_id, "transition intent is not an owned regular file"
                              )
                          if metadata.st_size > TRANSITION_INTENT_FILE_BYTE_CAP:
                              raise LifecycleError(
                                  failure_id, "transition intent byte limit exceeded"
                              )
                          total_bytes += metadata.st_size
                          if total_bytes > TRANSITION_INTENT_INVENTORY_BYTE_CAP:
                              raise LifecycleError(
                                  failure_id, "transition intent cumulative byte limit exceeded"
                              )
                          candidates.append(path)
              except LifecycleError:
                  raise
              except OSError as exc:
                  raise LifecycleError(failure_id, unreadable) from exc
              return sorted(candidates)


          def _validate_transfer_migration_receipt_bindings(
          ''',
          )
          replace_once(
              mutate,
              '''        for intent_path in sorted(transition_root.glob("*.json")):
                      intent = _load_transition_intent(root, intent_path)
          ''',
              '''        for intent_path in _bounded_transition_intent_inventory(
                      transition_root,
                      failure_id="WI-LEDGER-MIGRATION-REVOCATION-FROZEN",
                      unreadable="transition staging root is unreadable",
                  ):
                      intent = _load_transition_intent(root, intent_path)
          ''',
          )
          replace_once(
              mutate,
              '''def _load_transition_intent(root: Path, path: Path) -> dict:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise LifecycleError("WI-LIFECYCLE-TRANSITION-INTENT-INVALID", "transition intent is unreadable") from exc
          ''',
              '''def _load_transition_intent(root: Path, path: Path) -> dict:
              try:
                  snapshot = _capture_file_snapshot(
                      path,
                      failure_id="WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                      maximum_bytes=TRANSITION_INTENT_FILE_BYTE_CAP,
                      require_single_link=True,
                  )
                  payload = json.loads(snapshot.data.decode("utf-8", errors="strict"))
              except LifecycleError:
                  raise
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise LifecycleError(
                      "WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                      "transition intent is unreadable",
                  ) from exc
          ''',
          )
          replace_between(
              mutate,
              "def _ledger_location_proof_object(\n",
              "\n\ndef _ledger_location_lexically_exists(",
              '''def _ledger_location_proof_object(
              path: Path,
              *,
              failure_id: str,
              unreadable: str,
              maximum_bytes: int = LEDGER_LOCATION_PROOF_BYTE_CAP,
          ) -> tuple[dict, bytes]:
              def reject_duplicate_pairs(pairs: list[tuple[str, object]]) -> dict:
                  value: dict[str, object] = {}
                  for key, item in pairs:
                      if key in value:
                          raise LifecycleError(
                              failure_id, "ledger location proof repeats a JSON key"
                          )
                      value[key] = item
                  return value

              try:
                  raw = _capture_file_snapshot(
                      path,
                      failure_id=failure_id,
                      maximum_bytes=maximum_bytes,
                      require_single_link=True,
                  ).data
                  payload = json.loads(
                      raw.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_pairs,
                  )
              except LifecycleError:
                  raise
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise LifecycleError(failure_id, unreadable) from exc
              if not isinstance(payload, dict):
                  raise LifecycleError(
                      failure_id, "ledger location proof is not one JSON object"
                  )
              return payload, raw
          ''',
          )
          replace_between(
              mutate,
              "def _matching_ledger_location_intents(\n",
              "\n\ndef _validate_stable_ledger_settlement(",
              '''def _matching_ledger_location_intents(
              root: Path,
              repository: Path,
              *,
              slug: str,
              logical_work_item: str,
          ) -> list[tuple[dict, Path, bytes]]:
              transition_root = repository / ".scratch" / "work-items-lifecycle-transitions"
              if not _ledger_location_lexically_exists(transition_root):
                  return []
              _lifecycle_reject_unreduced_reparse(
                  transition_root,
                  failure_id="WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                  message="transition staging root is a link or reparse point",
              )
              if not transition_root.is_dir():
                  raise LifecycleError(
                      "WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                      "transition staging root is not a directory",
                  )
              matches: list[tuple[dict, Path, bytes]] = []
              candidates = _bounded_transition_intent_inventory(
                  transition_root,
                  failure_id="WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                  unreadable="transition staging root is unreadable",
              )
              loaded_bytes = 0
              for path in candidates:
                  payload, raw = _ledger_location_proof_object(
                      path,
                      failure_id="WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                      unreadable="transition intent is unreadable",
                      maximum_bytes=TRANSITION_INTENT_FILE_BYTE_CAP,
                  )
                  loaded_bytes += len(raw)
                  if loaded_bytes > TRANSITION_INTENT_INVENTORY_BYTE_CAP:
                      raise LifecycleError(
                          "WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                          "transition intent cumulative byte limit exceeded",
                      )
                  if payload.get("slug") != slug:
                      continue
                  _validate_ledger_location_intent(
                      root,
                      path,
                      payload,
                      slug=slug,
                      logical_work_item=logical_work_item,
                  )
                  matches.append((payload, path, raw))
              if len(matches) > 1:
                  raise LifecycleError(
                      "WI-LIFECYCLE-TRANSITION-INTENT-INVALID",
                      "multiple ledger location intents match one work item",
                  )
              return matches
          ''',
          )
          replace_between(
              mutate,
              "def _iter_transition_intents(root: Path) -> Iterable[Path]:\n",
              "\n\ndef _recover_all_transitions(",
              '''def _iter_transition_intents(root: Path) -> Iterable[Path]:
              repository = Path(root).resolve()
              if repository.name == "work-items":
                  repository = repository.parent
              directory = repository / ".scratch" / "work-items-lifecycle-transitions"
              if not directory.exists():
                  return
              if not directory.is_dir() or _lifecycle_path_has_reparse(directory):
                  raise LifecycleError(
