name: PR10 exact-head finalization v2

on:
  push:
    branches:
      - automation/pr10-finalize-1f31e84

permissions:
  contents: write

concurrency:
  group: pr10-exact-head-finalization-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: hotfix/lifecycle-successor-transfer
      EXPECTED_HEAD: 1f31e84d043607c2e41c72c80e16b72d965fe3e5
      AUTOMATION_BRANCH: automation/pr10-finalize-1f31e84
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: hotfix/lifecycle-successor-transfer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify authority and install test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$AUTOMATION_BRANCH"
          git show FETCH_HEAD:.github/pr10_finalize.py > /tmp/pr10_finalize.py
          python -m py_compile /tmp/pr10_finalize.py
          python -m pip install --disable-pip-version-check pytest
          git status --short

      - name: Capture exact-head full-suite baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=/tmp/pr10-baseline.xml > /tmp/pr10-baseline.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/pr10-baseline.rc
          tail -n 80 /tmp/pr10-baseline.log
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Apply one-owner corrections and regressions
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/pr10_finalize.py
          sed -i '/^from unittest import mock$/d' tests/test_pr10_integrity_regressions.py
          python scripts/sync-universal-hooks.py --sync
          python - <<'PY'
          from pathlib import Path
          canonical = Path("scripts/universal-hooks/scripts/check-git-push-gate.py").read_bytes()
          for mirror in (
              Path("src.claude/agents/scripts/check-git-push-gate.py"),
              Path("src.codex/skills/lead/scripts/check-git-push-gate.py"),
          ):
              assert mirror.read_bytes() == canonical, mirror
          PY
          git diff --check
          git diff --stat
          git diff > /tmp/pr10-final-diff.patch

      - name: Run exact focused verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mutate-work-item.py \
            scripts/universal-hooks/scripts/check-git-push-gate.py \
            src.claude/agents/scripts/check-git-push-gate.py \
            src.codex/skills/lead/scripts/check-git-push-gate.py
          python -m pytest -q tests/test_git_push_gate_hook.py
          python -m pytest -q \
            tests/test_mutate_work_item.py \
            tests/test_pr10_integrity_regressions.py
          python -m pytest -q tests/test_kimi_transport.py
          python -m pytest -q \
            tests/test_h1_relocation_integrity.py \
            tests/test_h1_artifact_set_relocation.py \
            tests/test_ledger_h1_effective_view.py \
            tests/test_ledger_h1_activation_writer.py \
            tests/test_transfer_receipt_integrity.py \
            tests/test_legacy_obligation_migration.py \
            tests/test_historical_disposition_archive_e2e.py \
            tests/test_lifecycle_readme_summary.py \
            tests/test_work_items_state_checker.py \
            tests/test_work_item_state_validator.py
          python -m pytest -q tests/test_provider_prompt_projections.py
          python scripts/sync-universal-hooks.py --check
          python scripts/validate-provider-prompt-projections.py \
            --require --scope source --source-root .
          python scripts/validate-claude-md.py
          python scripts/validate-arch-layering-slices.py
          python src.codex/skills/lead/scripts/validate-skill-pack.py
          python src.claude/agents/scripts/validate-skill-pack.py
          python -m pytest -q \
            tests/test_agents_spine_validator.py \
            tests/test_agents_spine_validator_fail_branches.py

      - name: Run broad candidate suite and compare with baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=/tmp/pr10-candidate.xml > /tmp/pr10-candidate.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/pr10-candidate.rc
          tail -n 100 /tmp/pr10-candidate.log
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def read_report(path: str):
              root = ET.parse(path).getroot()
              cases = set()
              failed = set()
              for case in root.iter("testcase"):
                  key = (
                      case.attrib.get("file", ""),
                      case.attrib.get("classname", ""),
                      case.attrib.get("name", ""),
                  )
                  cases.add(key)
                  if any(
                      child.tag.rsplit("}", 1)[-1] in {"failure", "error"}
                      for child in case
                  ):
                      failed.add(key)
              return cases, failed

          baseline_cases, baseline_failed = read_report("/tmp/pr10-baseline.xml")
          candidate_cases, candidate_failed = read_report("/tmp/pr10-candidate.xml")
          missing = baseline_cases - candidate_cases
          regressions = candidate_failed - baseline_failed
          summary = [
              f"baseline cases: {len(baseline_cases)}",
              f"baseline failures/errors: {len(baseline_failed)}",
              f"candidate cases: {len(candidate_cases)}",
              f"candidate failures/errors: {len(candidate_failed)}",
              f"missing baseline cases: {len(missing)}",
              f"new failures/errors: {len(regressions)}",
          ]
          print("\n".join(summary))
          Path("/tmp/pr10-suite-comparison.txt").write_text(
              "\n".join(summary)
              + "\n\nmissing:\n"
              + "\n".join(map(str, sorted(missing)))
              + "\n\nnew failures/errors:\n"
              + "\n".join(map(str, sorted(regressions)))
              + "\n",
              encoding="utf-8",
          )
          if missing or regressions:
              raise SystemExit(1)
          PY

      - name: Stage and run publication gate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            RELEASE_NOTES.md \
            docs/provider-runtime-layouts.md \
            scripts/mutate-work-item.py \
            scripts/universal-hooks/scripts/check-git-push-gate.py \
            src.claude/agents/scripts/check-git-push-gate.py \
            src.codex/skills/lead/scripts/check-git-push-gate.py \
            tests/test_git_push_gate_hook.py \
            tests/test_pr10_integrity_regressions.py
          git diff --cached --check
          python scripts/check-publication-gate.py
          test -z "$(git status --porcelain | grep '^??' || true)"

      - name: Commit and fast-forward the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden PR10 authorization recovery"
          final_sha=$(git rev-parse HEAD)
          git push origin "HEAD:$TARGET_BRANCH"
          printf '%s\n' "$final_sha" > /tmp/pr10-final-sha.txt
          {
            echo "## PR10 finalization"
            echo
            echo "Published commit: \`$final_sha\`"
            echo
            cat /tmp/pr10-suite-comparison.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr10-finalization-evidence-v2
          if-no-files-found: ignore
          path: |
            /tmp/pr10-baseline.log
            /tmp/pr10-baseline.xml
            /tmp/pr10-baseline.rc
            /tmp/pr10-candidate.log
            /tmp/pr10-candidate.xml
            /tmp/pr10-candidate.rc
            /tmp/pr10-suite-comparison.txt
            /tmp/pr10-final-diff.patch
            /tmp/pr10-final-sha.txt

      - name: Remove temporary automation branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$AUTOMATION_BRANCH"
