          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def read_report(path: str):
              root = ET.parse(path).getroot()
              cases = set()
              failed = set()
              for case in root.iter("testcase"):
                  key = (
                      case.attrib.get("file", ""),
                      case.attrib.get("classname", ""),
                      case.attrib.get("name", ""),
                  )
                  cases.add(key)
                  if any(child.tag.rsplit("}", 1)[-1] in {"failure", "error"} for child in case):
                      failed.add(key)
              return cases, failed

          baseline_cases, baseline_failed = read_report("/tmp/pr10-baseline.xml")
          candidate_cases, candidate_failed = read_report("/tmp/pr10-candidate.xml")
          missing = baseline_cases - candidate_cases
          regressions = candidate_failed - baseline_failed
          summary = [
              f"baseline cases: {len(baseline_cases)}",
              f"baseline failures/errors: {len(baseline_failed)}",
              f"candidate cases: {len(candidate_cases)}",
              f"candidate failures/errors: {len(candidate_failed)}",
              f"missing baseline cases: {len(missing)}",
              f"new failures/errors: {len(regressions)}",
          ]
          print("\n".join(summary))
          Path("/tmp/pr10-suite-comparison.txt").write_text(
              "\n".join(summary)
              + "\n\nmissing:\n"
              + "\n".join(map(str, sorted(missing)))
              + "\n\nnew failures/errors:\n"
              + "\n".join(map(str, sorted(regressions)))
              + "\n",
              encoding="utf-8",
          )
          if missing or regressions:
