interface:
  display_name: "Review Loop"
  short_description: "Run the autonomous parallel-review-loop on a fix-design artifact"
  default_prompt: "Use $review-loop to get independent multi-angle convergence on one written fix-design artifact before the change lands. Read and normalize .agents/.agents-mode.yaml first; confirm the artifact's root is runtime-verified THIS session (never pinned CONFIRMED). Dispatch three scope angles through the external surface with file-based prompt delivery — two SMART verdict angles (surgical correctness and deep reasoning) plus one mechanical SCOUT that casts no verdict and feeds the verdicts. This is the Codex runtime, not the Claude background-Agent loop: run angles concurrently when supported, else sequentially, and synthesize. Converge autonomously under the mandatory per-round anti-drift check (goal/scope/runtime-root unchanged), persist a review-loop-state record per round under .scratch/reviews/, cap at N=3 rounds, and gate the human only at convergence, drift, or deadlock. The deep angle returns its verdict directly and is NOT the standalone external-mode $consultant. Shipped auto stays on codex | claude. Do not commit, push, or install."
