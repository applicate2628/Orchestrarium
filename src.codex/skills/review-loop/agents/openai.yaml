interface:
  display_name: "Review Loop"
  short_description: "Run the autonomous parallel-review-loop on a fix-design artifact"
  default_prompt: "Use $review-loop under its operative contract. Verify current-session premises for each exact claim; read modes without config changes. Freeze a supported initial native/host or external route; preserve external-only and no switch after failed launch. Prefer the working state helper; declared owner-equivalent execution keeps identical guarantees and truthful manual provenance, never a fabricated helper receipt. Preserve frozen objective/revision/attempt IDs, terminal results, failures, retries, coverage and N=3. Require two nonauthoring verdicts and reconciled scout facts. The helper is procedural, not host enforcement; use the current documented observer boundary. Report convergence, drift or deadlock. Root receives convergence and continues already-authorized ready work; real user/scope/publication gates retain their dependent hold. This invocation grants no Source edit, commit, push or install authority."
