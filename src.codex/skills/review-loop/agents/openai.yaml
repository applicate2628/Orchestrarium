interface:
  display_name: "Review Loop"
  short_description: "Run the autonomous parallel-review-loop on a fix-design artifact"
  default_prompt: "Use $review-loop for multi-angle convergence on a fix-design artifact. Normalize .agents/.agents-mode.yaml and verify the artifact root this session. For the supported state path, call installed review_loop_state.py begin, require its committed ORCHESTRARIUM_REVIEW_LOOP_STATE_V2 receipt, and carry its attempt IDs and artifact revision in angle prompts. This is procedural, not host-enforced; bypass observation remains an open source-repository bug. Dispatch two SMART verdict angles and one mechanical SCOUT through the external surface with file-based prompts. Use the Codex loop, not Claude's background-Agent loop; run concurrently when supported, otherwise sequentially in fresh contexts, then synthesize. Record results, failures, retries, rounds, and terminal outcome through the same state owner; cap at N=3 and gate the human only at convergence, drift, or deadlock. The deep angle returns its verdict directly, not as standalone $consultant. Shipped auto stays on codex | claude. Do not commit, push, or install."
