interface:
  display_name: "Review Loop"
  short_description: "Run the autonomous parallel-review-loop on a fix-design artifact"
  default_prompt: "Use $review-loop for independent multi-angle convergence on one written fix-design artifact before it lands. Read and normalize .agents/.agents-mode.yaml first; confirm the artifact root is runtime-verified THIS session, never pinned CONFIRMED. Dispatch three angles through the external surface with file-based prompts: two SMART verdict angles (surgical correctness and deep reasoning) and one mechanical SCOUT that casts no verdict and feeds the verdicts. Run the Codex loop, not Claude's background-Agent loop; run angles concurrently when supported, else sequentially in fresh contexts, and synthesize. Converge under the per-round anti-drift check (goal/scope/runtime-root unchanged); persist state under .scratch/reviews/, cap at N=3 rounds, and gate the human only at convergence, drift, or deadlock. The deep angle returns its verdict directly and is not standalone $consultant. Shipped auto stays on codex | claude. Do not commit, push, or install."
