interface:
  display_name: "Design Panel"
  short_description: "Run N independent design lanes on one pinned problem, then synthesize"
  default_prompt: "Use $design-panel to generate independent multi-lane candidate designs for one pinned problem. Read and normalize .agents/.agents-mode.yaml first; verify the objective/scope/evidence package is admitted; a panel multiplies unverified premises. Dispatch N>=2 independent lanes through external surface with file-based prompt delivery, same pinned input with differing framing; run concurrently when supported, else sequentially in fresh contexts. Each lane writes design-<lane>.md with `Panel disposition: INPUT_ONLY` and `gate: RETURN(lead)`, never design-stage PASS. A died, empty, or duplicate-framing lane is UNVERIFIED; rerun it, never drop it from quorum. Synthesize directly (no spawned synthesizer or candidate author) with DP5: verified union for surface sweeps; select-or-combine for architecture; never majority-vote. Write the canonical design.md citing every candidate. Return only the synthesized design and gate, or REVISE/BLOCKED. Do not commit, push, or install."
