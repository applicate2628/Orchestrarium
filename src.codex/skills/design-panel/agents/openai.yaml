interface:
  display_name: "Design Panel"
  short_description: "Run N independent design lanes on one pinned problem, then synthesize"
  default_prompt: "Use $design-panel to get independent multi-lane generation of candidate designs on one pinned problem before a single design exists. Read and normalize .agents/.agents-mode.yaml first; confirm the pinned objective/scope/evidence package is admitted (a panel multiplies an unverified premise N times). Dispatch N>=2 independently-framed candidate lanes through the external surface with file-based prompt delivery, each carrying the identical pinned input with only the framing differing; run concurrently when supported, else sequentially in fresh contexts. Each candidate writes design-<lane>.md, carries Panel disposition: INPUT_ONLY, and is recorded gate: RETURN(lead), never design-stage PASS. A died/empty/duplicate-framing lane is UNVERIFIED and must be re-run, never silently dropped from quorum. Then perform the mandatory synthesis directly (never a spawned synthesizer subagent, never a candidate author): build the DP5 comparison/disposition matrix (verified union for surface sweeps, select-or-combine for architecture choices, never majority-vote), and write the sole canonical design.md citing every candidate as evidence. Return exactly one public result: the synthesized design and its gate, or REVISE/BLOCKED. Never present one candidate as the design. Do not commit, push, or install."
