interface:
  display_name: "Init Project"
  short_description: "Configure project policies and review or update the installed default .agents/.agents-mode.yaml"
  default_prompt: "Use $init-project to configure Project policies and .agents/.agents-mode.yaml. Preserve unknown routing fields and normalize the mode file before trusting flags; defaults are consultantMode=disabled, parallelMode=auto, and reserveResolver=claude-sonnet. Production auto uses Codex/Claude; Gemini/Qwen are explicit `WEAK MODEL / NOT RECOMMENDED` example-only paths, Kimi requires explicit global Windows enrollment, and Grok remains unavailable in 1.x. Modify only Project policies and the local mode file."
