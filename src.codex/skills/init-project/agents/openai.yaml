interface:
  display_name: "Init Project"
  short_description: "Configure project policies and review or update the installed default .agents/.agents-mode.yaml"
  default_prompt: "Use $init-project to configure project policies in root AGENTS.md and initialize or update .agents/.agents-mode.yaml. Reuse the installed lead policy catalog and external-dispatch contract; preserve unknown keys and canonical routing fields (consultantMode, delegationMode, parallelMode, mcpMode, preferExternalWorker, preferExternalReviewer, externalProvider, externalPriorityProfile, reserveResolver, externalPriorityProfiles, externalOpinionCounts, externalCodexWorkdirMode, externalClaudeWorkdirMode, externalModelMode, externalCodexProfile, externalClaudeProfile) unless explicitly changed. Normalize any existing mode file to the current canonical format before trusting its flags; keep defaults `consultantMode=disabled`, `parallelMode=auto`, and `reserveResolver=claude-sonnet`. Keep production auto routing on `codex | claude`; Gemini and Qwen remain explicit `WEAK MODEL / NOT RECOMMENDED` example-only paths. Modify only the Project policies section and local mode file."
