interface:
  display_name: "Init Project"
  short_description: "Configure project policies and review or update the installed default .agents/.agents-mode.yaml"
  default_prompt: "Use $init-project to configure Project policies and .agents/.agents-mode.yaml. Preserve unknown routing fields and normalize the mode file before trusting flags; defaults are consultantMode=disabled, parallelMode=auto, and reserveResolver=claude-sonnet. Production auto uses Codex/Claude; Kimi is explicit-only Windows read-only work through the canonical fixed `kimi-code/k3` file-prompt/no-tools wrapper, independently verified and nonauthorizing, and Grok remains unavailable in 1.x. Modify only Project policies and the local mode file."
