interface:
  display_name: "Init Project"
  short_description: "Configure project policies and review or update the installed default .agents/.agents-mode.yaml"
  default_prompt: "Use $init-project to configure Project policies and .agents/.agents-mode.yaml. Preserve unknown routing fields and normalize the mode file before trusting flags; defaults are consultantMode=disabled, parallelMode=auto, and reserveResolver=claude-sonnet. Production auto uses Codex/Claude; Kimi is an explicit-only Windows route through the canonical fixed `kimi-code/k3` wrapper with file-prompt delivery. An omitted Kimi capability file keeps tools/MCP/subagents empty with permission reject; a validated capability file may select admitted read tools or MCP servers, or scoped worker tools only for engineering plus a taxonomy-mapped external-worker profession. Ordinary launch does not consult enrollment, and the route remains independently verified and nonauthorizing; Grok remains unavailable in 1.x. Modify only Project policies and the local mode file."
