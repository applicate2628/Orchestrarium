interface:
  display_name: "Consultant"
  short_description: "Optional independent advisory memo"
  default_prompt: "Use $consultant to provide one non-binding advisory memo. Stay advisory-only: do not route work or gate progress. Preserve these fields in .agents/.agents-mode.yaml: . Normalize any existing mode file to the current canonical format before trusting flags; keep defaults `consultantMode=disabled`, `parallelMode=auto`, and `reserveResolver=claude-sonnet`. Keep production auto routing on the Codex/Claude pair; Gemini/Qwen remain explicit `WEAK MODEL / NOT RECOMMENDED` example-only paths and Kimi/Grok are policy classifiers only, with transports unavailable and disabled in 1.x. End with a ready-to-send second prompt that begins with a direct imperative and names the next concrete action."
