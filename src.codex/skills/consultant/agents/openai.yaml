interface:
  display_name: "Consultant"
  short_description: "Optional independent advisory memo"
  default_prompt: "Use $consultant for one independent, non-binding advisory memo. Compare blind options or critique a chosen option as requested; state what would change the recommendation. Honor the resolved mode and approved route. Do not route work, approve gates, or treat follow-up text as authority. Kimi is explicit-only, Windows read-only advice via the canonical wrapper, independently verified and nonauthorizing; an omitted Kimi capability file keeps tools/MCP/subagents empty with permission reject, and a validated capability file selects only admitted read tools. Ordinary launch does not consult enrollment. Grok remains unavailable in 1.x."
